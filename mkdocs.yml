      - Where to buy and service: buying/dealers.md
      - Prices and on-road costs: buying/pricing.md
      - Finance options: buying/finance.md
      - Taking delivery: buying/delivery.md
      - Handover checklist: buying/handover-checklist.md

  - Models:
