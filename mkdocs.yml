site_name: Zeekr Insiders Australia
site_description: Your friendly guide to owning a Zeekr in Australia. Learn, discover, and master your EV.
site_author: Zeekr Insiders Australia
# The wiki's host, as the club site links it. Canonicals and share images are built from it.
site_url: https://wiki.zeekrinsiders.com.au/

docs_dir: content
# These build each page's "Suggest an edit" link (GitHub's edit view of its Markdown source);
# the header shows no repository widget. Nothing is pushed yet, so the branch assumes main.
repo_url: https://github.com/zeekr-insiders/wiki
edit_uri: edit/main/content/

theme:
  name: material
  language: en-AU  # overrides/partials/languages/en-AU.html: lang="en-AU", English search
  custom_dir: overrides
  logo: assets/img/logo-badge.png
  favicon: assets/favicons/favicon-32.png
  # Fonts are self-hosted in zeekr.css, so no request goes to Google Fonts.
  font: false
  # The front door's glyphs (overrides/.icons/zi) for the chrome Material draws itself.
  icon:
    menu: zi/menu
    search: zi/search
    top: zi/up
    # Search's back, share and clear buttons, in the vendored Lucide outlines rather than Material's glyphs.
    previous: lucide/arrow-left
    share: lucide/share-2
    close: lucide/x
  palette:
    # Everyone starts in light, whatever the OS prefers, as on the front door. The toggle switches to
    # dark and back; Material keeps the visitor's choice in localStorage (__palette) and applies it
    # in the header before the page paints, so a dark choice reloads dark with no light flash.
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: zi/moon
        name: Switch to dark theme

    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: zi/sun
        name: Switch to light theme

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.sections
    - navigation.path
    - navigation.top
    - toc.follow
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.select
    - content.action.edit

extra:
  # Moved pages: old content path -> new one. hooks/redirects.py keeps the old URL working.
  redirects:
    knowledge/glossary.md: glossary/index.md
  # The first public publish, when every page lands in the feeds as new. Set it (YYYY-MM-DD)
  # when wiki-publish merges; until then the feeds carry no launch marker.
  launch_date: null
  # Google Search Console's HTML-tag ownership check: paste the token (the content="..." value only).
  # Empty, no tag is output.
  google_site_verification: ""
  club:
    name: "Zeekr Insiders"
    abbreviation: "ZI"
    full_name: "Zeekr Insiders Australia"
    location: "Australia"
    # The club takes messages through the front door's contact form, which routes them to the right person.
    contact_url: "https://zeekrinsiders.com.au/contact"
    website: "https://zeekrinsiders.com.au"
    forum_url: "https://forums.zeekrinsiders.com.au/"
  # The main club site. Every masthead and footer link is built from base_url, so moving the site is one change here.
  site:
    base_url: "https://zeekrinsiders.com.au"
    title_suffix: "Zeekr Insiders"
    forum_url: "https://forums.zeekrinsiders.com.au/"
    # Matches the club site's Join link: the forum registration page stands in until a join page exists.
    join_url: "https://forums.zeekrinsiders.com.au/register/"
    # The club's six sections, as in the club site's masthead. The masthead
    # and the phone drawer both list them from here. "path" is under base_url; "forum" uses forum_url;
    # "wiki" is this site, marked current.
    sections:
      - {path: /drives, icon: flag, short: Drives, text: Find a drive}
      - {path: /news, icon: pulse, short: News, text: "What's happening"}
      - {path: /garage, icon: garage, short: Garage, text: "Our stories & blog"}
      - {path: /insiders, icon: people, short: The Insiders, text: Meet the team}
      - {forum: true, icon: forum, short: Forum, text: Ask the forum}
      - {wiki: true, icon: book, short: Wiki, text: Master your Zeekr}
    og_image: "assets/img/og-default.png"
  # The club's channels: Facebook, Instagram, YouTube, X. Keep in step with the club site's social links.
  social:
    - icon: zi/facebook
      name: "Facebook: Zeekr Insiders"
      link: https://www.facebook.com/groups/2044179713083663/
    - icon: zi/instagram
      name: "Instagram: @zeekrinsiders"
      link: https://www.instagram.com/zeekrinsiders/
    - icon: zi/youtube
      name: "YouTube: @ZeekrInsiders"
      link: https://www.youtube.com/channel/UCGs7pzQ_eeVIMCbk118RTtw
    - icon: zi/x
      name: "X: @zeekrinsiders"
      link: https://x.com/zeekrinsiders

extra_css:
  - stylesheets/zeekr.css

extra_javascript:
  - javascripts/zeekr.js
  - javascripts/glossary.js
  - javascripts/handover.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  # Citations are footnotes. Definition order keeps each marker's number equal to its Sources entry,
  # and hooks/citations.py adds the labels, tooltips data and "Back to text" links.
  - footnotes:
      USE_DEFINITION_ORDER: true
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: zeekr-insiders
      repo: wiki
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Build-time HTML tweaks that need no plugin dependency.
hooks:
  - hooks/citations.py
  - hooks/cards.py
  - hooks/headings.py
  - hooks/tables.py
  - hooks/redirects.py
  - hooks/feeds.py
  - hooks/seo.py

plugins:
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - macros
  # Feeds for the main club site (it reads feed_rss_updated.xml). Dates come from git, so
  # CI checks out the full history. hooks/feeds.py adds each page's `changelog` line, its
  # section and extra.launch_date.
  - rss:
      enabled: true
      use_git: true
      # Above the page count, so the launch feed lists every page rather than the newest 20.
      length: 100
      abstract_chars_count: 160
      categories:
        - feed_section
      feed_title: Zeekr Insiders Wiki
      feed_description: Owner-run guide to buying and living with a Zeekr in Australia.
      image: https://wiki.zeekrinsiders.com.au/assets/img/logo-badge.png
      json_feed_enabled: true
      date_from_meta:
        default_timezone: Australia/Sydney
  - minify:
      minify_html: true
      # The theme's JS ships unminified in the repo; minify it at build. Not the CSS: the minifier drops the
      # spaces around + in clamp() and calc(), which makes those values invalid (the H1 size broke).
      minify_js: true
      js_files:
        - javascripts/zeekr.js
        - javascripts/glossary.js
        - javascripts/handover.js

nav:
