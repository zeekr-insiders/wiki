site_name: Zeekr Insiders Australia
site_description: Your friendly guide to owning a Zeekr in Australia. Learn, discover, and master your EV.
site_author: Zeekr Insiders Australia
# Planned wiki host, from web-home's LINKS.wiki. Canonicals and share images are built from it.
site_url: https://wiki.zeekrinsiders.com.au/

docs_dir: content

# These build each page's "Suggest an edit" link (GitHub's edit view of its Markdown source);
# the header shows no repository widget. Nothing is pushed yet, so the branch assumes main.
repo_url: https://github.com/zeekr-insiders/wiki
edit_uri: edit/main/content/

theme:
  name: material
  custom_dir: overrides
  logo: assets/img/logo-badge.png
  favicon: assets/favicons/favicon-32.png
  # Fonts are self-hosted in zeekr.css, so no request goes to Google Fonts.
  font: false
  # The front door's glyphs (overrides/.icons/zi) for the chrome Material draws itself.
  icon:
    menu: zi/menu
    search: zi/search
    top: zi/up
  palette:
    # Two states, as on the front door: the first visit follows the OS, the toggle then picks one.
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: zi/sun
        name: Switch to light theme

    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: zi/moon
        name: Switch to dark theme

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.sections
    - navigation.path
    - navigation.top
    - toc.follow
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.select
    - content.action.edit

extra:
  club:
    name: "Zeekr Insiders"
    abbreviation: "ZI"
    full_name: "Zeekr Insiders Australia"
    location: "Australia"
    # The club takes messages through the front door's contact form, which routes them to the right person.
    contact_url: "https://zeekrinsiders.com.au/contact"
    website: "https://zeekrinsiders.com.au"
    forum_url: "https://forums.zeekrinsiders.com.au/"
  # The front door (web-home). Every masthead and footer link is built from base_url, so moving the site is one change here.
  site:
    base_url: "https://zeekrinsiders.com.au"
    title_suffix: "Zeekr Insiders"
    forum_url: "https://forums.zeekrinsiders.com.au/"
    # Mirrors web-home's JOIN_URL: the forum registration page stands in until a join page exists.
    join_url: "https://forums.zeekrinsiders.com.au/register/"
    # The club's six sections, as in the front door's masthead (web-home SiteMasthead.svelte). The masthead
    # and the phone drawer both list them from here. "path" is under base_url; "forum" uses forum_url;
    # "wiki" is this site, marked current.
    sections:
      - {path: /drives, icon: flag, short: Drives, text: Find a drive}
      - {path: /news, icon: pulse, short: News, text: "What's happening"}
      - {path: /garage, icon: garage, short: Garage, text: "Our stories & blog"}
      - {path: /insiders, icon: people, short: The Insiders, text: Meet the team}
      - {forum: true, icon: forum, short: Forum, text: Ask the forum}
      - {wiki: true, icon: book, short: Wiki, text: Owner tips}
    og_image: "assets/img/og-default.png"
  # Same three channels, in the same order, as the front door footer (web-home src/lib/data/socials.json).
  social:
    - icon: zi/facebook
      name: "Facebook: Zeekr Insiders"
      link: https://www.facebook.com/groups/2044179713083663/
    - icon: zi/youtube
      name: "YouTube: @ZeekrInsiders"
      link: https://www.youtube.com/channel/UCGs7pzQ_eeVIMCbk118RTtw
    - icon: zi/x
      name: "X: @zeekrinsiders"
      link: https://x.com/zeekrinsiders

extra_css:
  - stylesheets/zeekr.css

extra_javascript:
  - javascripts/zeekr.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  # Citations are footnotes. Definition order keeps each marker's number equal to its Sources entry,
  # and hooks/citations.py adds the labels, tooltips data and "Back to text" links.
  - footnotes:
      USE_DEFINITION_ORDER: true
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: thushan
      repo: zeekr
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Build-time HTML tweaks that need no plugin dependency.
hooks:
  - hooks/citations.py
  - hooks/cards.py

plugins:
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - macros
  - minify:
      minify_html: true

nav:
  - Home: index.md

  - Getting Started:
      - getting-started/index.md
      - EV Basics: getting-started/ev-basics.md
      - Why Zeekr?: getting-started/why-zeekr.md
      - Choosing a Model: getting-started/choosing-model.md

  - Buying:
      - buying/index.md
      - Where to Buy: buying/dealers.md
      - Pricing Guide: buying/pricing.md
      - Finance Options: buying/finance.md
      - Taking Delivery: buying/delivery.md

  - Models:
      - models/index.md
      - Zeekr 7X:
          - Overview: models/7x/overview.md
          - Which 7X Do I Have?: models/7x/which-7x.md
          - Specifications: models/7x/2025/specifications.md
          - Pricing: models/7x/2025/pricing.md
          - Service Schedule: models/7x/2025/service-schedule.md
          - Known Issues: models/7x/knowledge-base/7x-issues.md
          - Modifications: models/7x/knowledge-base/7x-mods.md
      - Zeekr X:
          - Overview: models/x/overview.md
          - Specifications: models/x/2025/specifications.md
          - Pricing: models/x/2025/pricing.md
          - Service Schedule: models/x/2025/service-schedule.md
      - Zeekr 009:
          - Overview: models/009/overview.md
          - Specifications: models/009/specifications.md
          - Pricing: models/009/pricing.md
          - Service Schedule: models/009/service-schedule.md
      - Model Comparison: comparisons/model-comparison-table.md

  - Ownership:
      - ownership/index.md
      - I've Just Got My Car: ownership/first-30-days.md
      - Charging:
          - Home Setup: guides/charging/home-setup.md
          - Public Networks: guides/charging/public-networks.md
          - Road Trips: guides/charging/road-trips.md
      - Insurance: ownership/insurance.md
      - Accessories:
          - ownership/accessories/index.md
          - Protection (PPF/Tint): ownership/accessories/protection.md
          - Recommended Gear: ownership/accessories/recommended.md
          - Choosing an Installer: ownership/accessories/vendors.md

  - Community:
      - community/index.md
      - Events & Meetups: community/events.md
      - Group Buys: community/group-buys.md
      - Forum: community/forum.md

  - Resources:
      - resources/index.md
      - National: resources/national/index.md
      # The section's own landing page comes first and untitled: with navigation.indexes, Material
      # takes a section's first index.md as the section itself, which once swallowed Victoria.
      - By State:
          - resources/states/index.md
          - Victoria: resources/vic/index.md
          - New South Wales: resources/nsw/index.md
          - Queensland: resources/qld/index.md
          - South Australia: resources/sa/index.md
          - Western Australia: resources/wa/index.md
          - Tasmania: resources/tas/index.md
          - ACT: resources/act/index.md
          - Northern Territory: resources/nt/index.md
      - Zeekr vs Competitors: comparisons/zeekr-vs-competitors.md
