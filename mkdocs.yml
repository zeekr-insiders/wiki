site_name: Zeekr Insiders Australia
site_description: Your friendly guide to owning a Zeekr in Australia. Learn, discover, and master your EV.
site_author: Zeekr Insiders Australia
site_url: https://thushan.github.io/zeekr/

docs_dir: content

theme:
  name: material
  custom_dir: overrides
  logo: assets/zi-logo.png
  favicon: assets/favicon.png
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.sections
    - navigation.path
    - navigation.top
    - toc.follow
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.select

extra:
  club:
    name: "Zeekr Insiders"
    abbreviation: "ZI"
    full_name: "Zeekr Insiders Australia"
    location: "Australia"
    contact_email: "insiders@zeekr.club"
    website: "https://zeekr.club"
    forum_url: ""  # To be added when forum is ready
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/thushan/zeekr
    - icon: fontawesome/brands/facebook
      link: https://facebook.com/groups/zeekrinsiders
    - icon: fontawesome/brands/instagram
      link: https://instagram.com/zeekrinsiders

extra_css:
  - stylesheets/zeekr.css

extra_javascript:
  - javascripts/zeekr.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: thushan
      repo: zeekr
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - macros
  - minify:
      minify_html: true

