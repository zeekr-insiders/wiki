          - Specifications: models/7x/2025/specifications.md
          - Prices: models/7x/2025/pricing.md
          - Servicing and warranty: models/7x/2025/service-schedule.md
          - Known issues and fixes: models/7x/knowledge-base/7x-issues.md
          - Owner tips: models/7x/owner-tips.md
          - Owner modifications: models/7x/knowledge-base/7x-mods.md
      - Zeekr X:
          - Overview: models/x/overview.md
          - Specifications: models/x/2025/specifications.md
          - Prices: models/x/2025/pricing.md
          - Servicing and warranty: models/x/2025/service-schedule.md
      - Zeekr 7GT:
          - Overview: models/7gt/overview.md
          - Specifications: models/7gt/specifications.md
      - Zeekr 009:
          - Overview: models/009/overview.md
          - Specifications: models/009/specifications.md
          - Prices: models/009/pricing.md
          - Servicing and warranty: models/009/service-schedule.md
      - Model comparison: comparisons/model-comparison-table.md

  - Ownership:
      - ownership/index.md
      - I've just got my car: ownership/first-30-days.md
      - Charging:
          - Home charging: guides/charging/home-setup.md
          - Public charging: guides/charging/public-networks.md
          - Charging etiquette: guides/charging/etiquette.md
          - Road trips: guides/charging/road-trips.md
      - Insurance: ownership/insurance.md
      - Accessories:
          - ownership/accessories/index.md
          - Paint and window protection: ownership/accessories/protection.md
          - Recommended accessories: ownership/accessories/recommended.md
          - Choosing an installer: ownership/accessories/vendors.md

  # Evergreen explainers, in the reading order the index's diagram suggests.
  - Knowledge:
      - knowledge/index.md
      - kW vs kWh: knowledge/kw-vs-kwh.md
      - NMC vs LFP batteries: knowledge/nmc-vs-lfp.md
      - Charging to 80% vs 100%: knowledge/charging-80-vs-100.md
      - Home charging explained: knowledge/home-charging.md
      - AC vs DC and the charging curve: knowledge/charging-curve.md
      - Plugs and cables: knowledge/plugs-and-cables.md
      - Range in the real world: knowledge/real-world-range.md
      - V2L, V2H and V2G: knowledge/v2l-v2h-v2g.md

  - Glossary: glossary/index.md

  - Community:
      - community/index.md
      - Drives and events: community/events.md
      - Group buys: community/group-buys.md
      - Forum: community/forum.md

  - Resources:
      - resources/index.md
      - National: resources/national/index.md
      # The section's own landing page comes first and untitled: with navigation.indexes, Material
      # takes a section's first index.md as the section itself, which once swallowed Victoria.
      - By state and territory:
          - resources/states/index.md
          - Victoria: resources/vic/index.md
          - New South Wales: resources/nsw/index.md
          - Queensland: resources/qld/index.md
          - South Australia: resources/sa/index.md
          - Western Australia: resources/wa/index.md
