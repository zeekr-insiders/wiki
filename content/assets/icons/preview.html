<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zeekr Insiders Icon Sheet</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: 'Space Grotesk', -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: #0d0d0d;
        color: #F2F2F2;
        padding: 2.5rem;
        line-height: 1.5;
    }

    header {
        max-width: 1180px;
        margin: 0 auto 2.5rem;
    }

    h1 {
        font-size: 1.6rem;
        letter-spacing: 0.02em;
    }

    h1 span { color: #FF5A00; }

    .subtitle {
        color: #999;
        font-size: 0.9rem;
        margin-top: 0.25rem;
    }

    .panel {
        max-width: 1180px;
        margin: 0 auto 2rem;
        border-radius: 14px;
        padding: 2rem;
    }

    .panel-label {
        font-size: 0.75rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #FF5A00;
        margin-bottom: 1.5rem;
    }

    .panel.light { background: #F2F2F2; color: #1A1A1A; }
    .panel.dark  { background: #1A1A1A; color: #F2F2F2; border: 1px solid #2c2c2c; }

    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
        gap: 1rem;
    }

    .tile {
        border-radius: 10px;
        padding: 1.1rem 1rem 0.9rem;
        text-align: center;
    }

    .panel.light .tile { background: #ffffff; border: 1px solid #e2e2e2; }
    .panel.dark .tile  { background: #222222; border: 1px solid #333333; }

    .sizes {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 0.9rem;
        margin-bottom: 0.8rem;
        min-height: 52px;
    }

    /* Same recolour pipeline as the site: flatten to black, map to #FF5A00 */
    img.zi {
        filter: brightness(0) saturate(100%) invert(40%) sepia(100%) saturate(726%) hue-rotate(-12deg) brightness(94%) contrast(127%);
        display: block;
    }

    img.s48 { width: 48px; height: 48px; }
    img.s20 { width: 20px; height: 20px; margin-bottom: 3px; }

    .name {
        font-size: 0.82rem;
        font-weight: 600;
        letter-spacing: 0.02em;
    }

    .file {
        font-size: 0.7rem;
        font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
        color: #888;
        margin-top: 2px;
    }

    .panel.light .file { color: #777; }
</style>
</head>
<body>
    <header>
        <h1>Zeekr Insiders <span>Icon Sheet</span></h1>
        <p class="subtitle">38 icons - 24x24 grid, 1.5px stroke, round caps and joins. Each shown at 48px and 20px through the site's orange filter pipeline.</p>
    </header>

    <section class="panel light">
        <div class="panel-label">Light Panel - Arctic White</div>
        <div class="grid" data-grid></div>
    </section>

    <section class="panel dark">
        <div class="panel-label">Dark Panel - Carbon Grey</div>
        <div class="grid" data-grid></div>
    </section>

    <script>
        const icons = [
            ['Voltage', 'icon-voltage.svg'],
            ['Charging Speed', 'icon-charging-speed.svg'],
            ['Acceleration', 'icon-acceleration.svg'],
            ['Price', 'icon-price.svg'],
            ['Finance', 'icon-finance.svg'],
            ['Battery', 'icon-battery.svg'],
            ['Range', 'icon-range.svg'],
            ['Motor', 'icon-motor.svg'],
            ['Power', 'icon-power.svg'],
            ['Torque', 'icon-torque.svg'],
            ['Wheelbase', 'icon-wheelbase.svg'],
            ['Boot Space', 'icon-bootspace.svg'],
            ['Frunk', 'icon-frunk.svg'],
            ['Dimensions', 'icon-dimensions.svg'],
            ['Ground Clearance', 'icon-ground-clearance.svg'],
            ['Kerb Weight', 'icon-kerb-weight.svg'],
            ['Towing', 'icon-towing.svg'],
            ['Seating', 'icon-seating.svg'],
            ['Air Suspension', 'icon-air-suspension.svg'],
            ['All-Wheel Drive', 'icon-awd.svg'],
            ['Rear-Wheel Drive', 'icon-rwd.svg'],
            ['Sliding Screen', 'icon-screen.svg'],
            ['Speakers', 'icon-speaker.svg'],
            ['Safety Rating', 'icon-safety.svg'],
            ['Dealers', 'icon-dealers.svg'],
            ['Delivery', 'icon-delivery.svg'],
            ['First 30 Days', 'icon-calendar-check.svg'],
            ['Insurance', 'icon-insurance.svg'],
            ['Accessories', 'icon-accessories.svg'],
            ['Protection', 'icon-protection.svg'],
            ['Recommended', 'icon-recommended.svg'],
            ['Service &amp; Vendors', 'icon-service.svg'],
            ['Guides', 'icon-guides.svg'],
            ['Community', 'icon-community.svg'],
            ['The Lineup', 'icon-lineup.svg'],
            ['Body - Mid SUV', 'icon-body-suv.svg'],
            ['Body - Compact SUV', 'icon-body-compact.svg'],
            ['Body - People Mover', 'icon-body-mpv.svg'],
        ];

        document.querySelectorAll('[data-grid]').forEach(grid => {
            grid.innerHTML = icons.map(([name, file]) => `
                <div class="tile">
                    <div class="sizes">
                        <img class="zi s48" src="${file}" alt="">
                        <img class="zi s20" src="${file}" alt="">
                    </div>
                    <div class="name">${name}</div>
                    <div class="file">${file}</div>
                </div>
            `).join('');
        });
    </script>
</body>
</html>
