<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- DC Fast Charger Station -->
  <!-- Main pillar/body -->
  <rect x="6" y="3" width="9" height="14" rx="1"/>
  <!-- Screen/display area -->
  <rect x="8" y="5" width="5" height="4" rx="0.5"/>
  <!-- Lightning bolt on screen (fast charging indicator) -->
  <path d="M11 6l-1.5 2h2l-1.5 2"/>
  <!-- Charging cable -->
  <path d="M15 12h2c1 0 2 1 2 2v3"/>
  <!-- CCS plug head -->
  <rect x="17" y="17" width="4" height="3" rx="0.5"/>
  <circle cx="18.5" cy="18.5" r="0.5"/>
  <circle cx="19.5" cy="18.5" r="0.5"/>
  <!-- Base/ground -->
  <line x1="6" y1="20" x2="15" y2="20"/>
</svg>
