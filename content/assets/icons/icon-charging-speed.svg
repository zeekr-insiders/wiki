<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  width="64"
  height="64"
  aria-hidden="true"
>
  <defs>
    <style>
      .z-stroke {
        stroke: currentColor;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }

      .z-accent {
        fill: var(--zeekr-electric-blue, #00D4FF);
      }
    </style>
  </defs>

  <!-- Battery body -->
  <rect
    class="z-stroke"
    x="1"
    y="18"
    width="58"
    height="34"
    rx="4"
  />

  <!-- Battery terminal -->
  <rect
    class="z-stroke"
    x="59"
    y="24"
    width="5"
    height="22"
    rx="1"
  />

  <!-- Lightning bolt (your path, centred) -->
  <g transform="translate(17 21) scale(1.1)">
    <path
      class="z-accent"
      d="M13 2L3 14h8l-1 8 10-12h-8l1-8z"
    />
  </g>
</svg>
