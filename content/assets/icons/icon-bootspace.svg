  <!-- Cargo inside boot -->
  <rect x="8" y="12" width="3" height="3" rx="0.5"/>
  <rect x="12" y="13" width="4" height="2" rx="0.5"/>
  <!-- Rear wheels -->
  <circle cx="6" cy="19" r="2"/>
  <circle cx="18" cy="19" r="2"/>
</svg>
