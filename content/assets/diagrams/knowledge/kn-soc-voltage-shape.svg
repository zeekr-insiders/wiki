<svg xmlns="http://www.w3.org/2000/svg" class="zk " viewBox="0 0 480 661" role="img" aria-labelledby="kn-soc-voltage-shape-title kn-soc-voltage-shape-desc">
<title id="kn-soc-voltage-shape-title">Why LFP is harder to gauge: voltage vs state of charge</title>
<desc id="kn-soc-voltage-shape-desc">Illustrative line chart of cell voltage against state of charge. NMC rises steadily across its 3.0 to 4.2 V operating range. LFP stays nearly flat across most of its 2.5 to 3.65 V range and is steep only at both ends, so the car cannot tell 40% from 70% by voltage alone; a full charge lets the car recalibrate. Shapes are not measured data.</desc>
<defs>
<style>
svg.zk{width:100%;height:auto;display:block;max-width:600px;--zk-invm:#A6A6A6}
svg.zk.zk-wide{max-width:none}
[data-md-color-scheme="slate"] svg.zk{--zk-invm:#595959}
.zk .bg{fill:var(--bg,#F2F2F2)}
.zk .f-bg{fill:var(--bg,#F2F2F2)}
.zk .f-panel{fill:var(--panel,#FFFFFF)}
.zk .f-ink{fill:var(--ink,#1A1A1A)}
.zk .f-muted{fill:var(--ink-muted,#595959)}
.zk .f-accent{fill:var(--accent-ink,#B03C00)}
.zk .f-tint{fill:var(--ink,#1A1A1A);fill-opacity:.06}
.zk .f-atint{fill:var(--accent-ink,#B03C00);fill-opacity:.10}
.zk .f-none{fill:none}
.zk .s-ink{stroke:var(--ink,#1A1A1A)}
.zk .s-muted{stroke:var(--ink-muted,#595959)}
.zk .s-line{stroke:var(--line-strong,rgba(26,26,26,.36))}
.zk .s-rule{stroke:var(--line,rgba(26,26,26,.14))}
.zk .s-accent{stroke:var(--accent-ink,#B03C00)}
.zk .s-bg{stroke:var(--bg,#F2F2F2)}
.zk .s-inv{stroke:var(--bg,#F2F2F2)}
.zk .icon{fill:none;stroke-linecap:round;stroke-linejoin:round}
.zk text{font-family:var(--font-body,'IBM Plex Sans Condensed','Arial Narrow',ui-sans-serif,sans-serif);font-weight:500}
.zk text.d{font-family:var(--font-display,'Space Grotesk',ui-sans-serif,system-ui,sans-serif)}
.zk text.w4{font-weight:400}.zk text.w6{font-weight:600}
.zk .c-ink{fill:var(--ink,#1A1A1A)}
.zk .c-muted{fill:var(--ink-muted,#595959)}
.zk .c-accent{fill:var(--accent-ink,#B03C00)}
.zk .c-inv{fill:var(--bg,#F2F2F2)}
.zk .c-invm{fill:var(--zk-invm)}
@media (max-width:599px){svg.zk-pair-wide{display:none}}
@media (min-width:600px){svg.zk-pair-narrow{display:none}}
</style>
<marker id="kn-soc-voltage-shape-a" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path class="f-muted" d="M0 0L8 4L0 8z"/></marker>
<marker id="kn-soc-voltage-shape-ai" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path class="f-ink" d="M0 0L10 5L0 10z"/></marker>
<marker id="kn-soc-voltage-shape-aa" markerWidth="14" markerHeight="12" refX="14" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path class="f-accent" d="M0 0L14 6L0 12z"/></marker>
<pattern id="kn-soc-voltage-shape-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" class="f-panel"/><line x1="0" y1="0" x2="0" y2="6" class="s-muted" stroke-width="2"/></pattern>
</defs>
<rect class="bg" width="480" height="661"/>
<text class="w6 c-muted" x="24" y="36" font-size="12" letter-spacing="0.14em">CHARGING TO 80% VS 100%: CALIBRATION</text>
<text class="d w6 c-ink" x="24" y="76" font-size="28">LFP's flat voltage makes the</text>
<text class="d w6 c-ink" x="24" y="106" font-size="28">gauge drift.</text>
<text class="c-muted" x="24" y="135" font-size="15">The car estimates charge largely from voltage. On a flat curve, that</text>
<text class="c-muted" x="24" y="155" font-size="15">estimate wanders.</text>
<text class="w6 c-muted" x="24" y="195" font-size="14">Cell voltage</text>
<rect class="f-none s-line" x="191.781" y="181" width="264.219" height="19" rx="2" stroke-width="1"/>
<text class="w6 c-muted" x="197.781" y="194.46" font-size="11" letter-spacing="0.1em">ILLUSTRATIVE SHAPE, NOT MEASURED DATA</text>
<rect class="f-tint" x="220.8" y="211" width="117.6" height="224" rx="0"/>
<line class="s-line" x1="220.8" y1="211" x2="220.8" y2="435" stroke-width="1" stroke-dasharray="3 3"/>
<line class="s-line" x1="338.4" y1="211" x2="338.4" y2="435" stroke-width="1" stroke-dasharray="3 3"/>
