<line class="s-muted" x1="58" y1="418.2" x2="64" y2="418.2" stroke-width="1"/>
<text class="c-muted" x="54" y="423.2" font-size="14" text-anchor="end">2.5 V</text>
<line class="s-muted" x1="58" y1="362.2" x2="64" y2="362.2" stroke-width="1"/>
<text class="c-muted" x="54" y="367.2" font-size="14" text-anchor="end">3.0 V</text>
<line class="s-muted" x1="58" y1="289.4" x2="64" y2="289.4" stroke-width="1"/>
<text class="c-muted" x="54" y="294.4" font-size="14" text-anchor="end">3.65 V</text>
<line class="s-muted" x1="58" y1="227.8" x2="64" y2="227.8" stroke-width="1"/>
<text class="c-muted" x="54" y="232.8" font-size="14" text-anchor="end">4.2 V</text>
<path class="f-none s-ink" d="M64.0 362.2 C70.5 355.1 83.6 330.8 103.2 319.6 C122.8 308.4 155.5 301.7 181.6 295.0 C207.7 288.3 233.9 284.9 260.0 279.3 C286.1 273.7 312.3 267.7 338.4 261.4 C364.5 255.1 397.2 246.8 416.8 241.2 C436.4 235.6 449.5 230.0 456.0 227.8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 5"/>
<path class="f-none s-accent" d="M64.0 418.2 C66.0 409.8 70.5 380.5 75.8 367.8 C81.0 355.1 84.3 347.5 95.4 342.0 C106.5 336.6 115.0 337.0 142.4 335.3 C169.8 333.6 220.8 333.1 260.0 332.0 C299.2 330.8 350.2 329.7 377.6 328.6 C405.0 327.5 413.5 327.5 424.6 325.2 C435.7 323.0 439.0 321.1 444.2 315.2 C449.5 309.2 454.0 293.7 456.0 289.4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<line class="s-ink" x1="64" y1="435" x2="456" y2="435" stroke-width="1.5"/>
<text class="w6 c-ink" x="79.68" y="236.76" font-size="15">NMC (dashed)</text>
<text class="w6 c-accent" x="87.52" y="365.96" font-size="15">LFP (solid)</text>
<line class="s-ink" x1="64" y1="435" x2="64" y2="441" stroke-width="1.5"/>
<text class="c-muted" x="64" y="459" font-size="14">0%</text>
<line class="s-ink" x1="220.8" y1="435" x2="220.8" y2="441" stroke-width="1.5"/>
<text class="c-muted" x="220.8" y="459" font-size="14" text-anchor="middle">40%</text>
<line class="s-ink" x1="338.4" y1="435" x2="338.4" y2="441" stroke-width="1.5"/>
<text class="c-muted" x="338.4" y="459" font-size="14" text-anchor="middle">70%</text>
<line class="s-ink" x1="456" y1="435" x2="456" y2="441" stroke-width="1.5"/>
<text class="c-muted" x="456" y="459" font-size="14" text-anchor="end">100%</text>
<text class="w6 c-muted" x="456" y="481" font-size="14" text-anchor="end">State of charge</text>
<circle class="f-ink" cx="279.6" cy="359.96" r="10"/>
<text class="d w6 c-inv" x="279.6" y="364.46" font-size="13" text-anchor="middle">1</text>
<circle class="f-ink" cx="434" cy="292.76" r="10"/>
<text class="d w6 c-inv" x="434" y="297.26" font-size="13" text-anchor="middle">2</text>
<circle class="f-ink" cx="34" cy="516" r="10"/>
<text class="d w6 c-inv" x="34" y="520.5" font-size="13" text-anchor="middle">1</text>
<text class="c-ink" x="56" y="521" font-size="15">Small voltage change across most of the range, so the car</text>
<text class="c-ink" x="56" y="541" font-size="15">cannot tell 40% from 70% by voltage alone.</text>
<circle class="f-ink" cx="34" cy="568" r="10"/>
<text class="d w6 c-inv" x="34" y="572.5" font-size="13" text-anchor="middle">2</text>
<text class="c-ink" x="56" y="573" font-size="15">A full charge lets the car recalibrate.</text>
<line class="s-rule" x1="24" y1="595" x2="456" y2="595" stroke-width="1"/>
<text class="c-muted" x="24" y="619" font-size="14">Operating range per cell: NMC 3.0 to 4.2 V; LFP 2.5 to 3.65 V (Battery</text>
<text class="c-muted" x="24" y="637" font-size="14">University).</text>
</svg>
