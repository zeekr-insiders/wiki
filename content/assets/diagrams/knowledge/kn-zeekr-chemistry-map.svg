<svg xmlns="http://www.w3.org/2000/svg" class="zk " viewBox="0 0 480 551" role="img" aria-labelledby="kn-zeekr-chemistry-map-title kn-zeekr-chemistry-map-desc">
<title id="kn-zeekr-chemistry-map-title">Which Zeekr has which battery</title>
<desc id="kn-zeekr-chemistry-map-desc">Zeekr grades grouped by battery chemistry, with bar length proportional to pack size. LFP: X RWD 61 kWh and 7X RWD 75 kWh. NMC: X AWD 66 kWh, 7X Long Range RWD 100 kWh, 7X Performance AWD 100 kWh and 009 FWD 116 kWh. The 009 AWD battery is not stated in sources.</desc>
<defs>
<style>
svg.zk{width:100%;height:auto;display:block;max-width:600px;--zk-invm:#A6A6A6}
svg.zk.zk-wide{max-width:none}
[data-md-color-scheme="slate"] svg.zk{--zk-invm:#595959}
.zk .bg{fill:var(--bg,#F2F2F2)}
.zk .f-bg{fill:var(--bg,#F2F2F2)}
.zk .f-panel{fill:var(--panel,#FFFFFF)}
.zk .f-ink{fill:var(--ink,#1A1A1A)}
.zk .f-muted{fill:var(--ink-muted,#595959)}
.zk .f-accent{fill:var(--accent-ink,#B03C00)}
.zk .f-tint{fill:var(--ink,#1A1A1A);fill-opacity:.06}
.zk .f-atint{fill:var(--accent-ink,#B03C00);fill-opacity:.10}
.zk .f-none{fill:none}
.zk .s-ink{stroke:var(--ink,#1A1A1A)}
.zk .s-muted{stroke:var(--ink-muted,#595959)}
.zk .s-line{stroke:var(--line-strong,rgba(26,26,26,.36))}
.zk .s-rule{stroke:var(--line,rgba(26,26,26,.14))}
.zk .s-accent{stroke:var(--accent-ink,#B03C00)}
.zk .s-bg{stroke:var(--bg,#F2F2F2)}
.zk .s-inv{stroke:var(--bg,#F2F2F2)}
.zk .icon{fill:none;stroke-linecap:round;stroke-linejoin:round}
.zk text{font-family:var(--font-body,'IBM Plex Sans Condensed','Arial Narrow',ui-sans-serif,sans-serif);font-weight:500}
.zk text.d{font-family:var(--font-display,'Space Grotesk',ui-sans-serif,system-ui,sans-serif)}
.zk text.w4{font-weight:400}.zk text.w6{font-weight:600}
.zk .c-ink{fill:var(--ink,#1A1A1A)}
.zk .c-muted{fill:var(--ink-muted,#595959)}
.zk .c-accent{fill:var(--accent-ink,#B03C00)}
.zk .c-inv{fill:var(--bg,#F2F2F2)}
.zk .c-invm{fill:var(--zk-invm)}
@media (max-width:599px){svg.zk-pair-wide{display:none}}
@media (min-width:600px){svg.zk-pair-narrow{display:none}}
</style>
<marker id="kn-zeekr-chemistry-map-a" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path class="f-muted" d="M0 0L8 4L0 8z"/></marker>
<marker id="kn-zeekr-chemistry-map-ai" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path class="f-ink" d="M0 0L10 5L0 10z"/></marker>
<marker id="kn-zeekr-chemistry-map-aa" markerWidth="14" markerHeight="12" refX="14" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path class="f-accent" d="M0 0L14 6L0 12z"/></marker>
<pattern id="kn-zeekr-chemistry-map-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" class="f-panel"/><line x1="0" y1="0" x2="0" y2="6" class="s-muted" stroke-width="2"/></pattern>
</defs>
<rect class="bg" width="480" height="551"/>
