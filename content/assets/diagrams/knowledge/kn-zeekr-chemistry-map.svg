<text class="d w6 c-ink" x="40" y="315" font-size="24">NMC</text>
<rect class="f-ink" x="104" y="297" width="20" height="20" rx="1"/>
<text class="c-muted" x="136" y="313" font-size="14">Bigger-battery and performance grades</text>
