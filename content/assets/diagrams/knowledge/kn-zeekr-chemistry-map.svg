<rect class="f-ink" x="192" y="347" width="100.138" height="16" rx="1"/>
<text class="w6 c-ink" x="300.138" y="360" font-size="14">66 kWh</text>
<text class="w6 c-ink" x="40" y="391" font-size="15">7X Long Range RWD</text>
<rect class="f-ink" x="192" y="379" width="151.724" height="16" rx="1"/>
<text class="w6 c-ink" x="351.724" y="392" font-size="14">100 kWh</text>
<text class="w6 c-ink" x="40" y="423" font-size="15">7X Performance AWD</text>
<rect class="f-ink" x="192" y="411" width="151.724" height="16" rx="1"/>
<text class="w6 c-ink" x="351.724" y="424" font-size="14">100 kWh</text>
<text class="w6 c-ink" x="40" y="455" font-size="15">009 FWD</text>
<rect class="f-ink" x="192" y="443" width="176" height="16" rx="1"/>
<text class="w6 c-ink" x="376" y="456" font-size="14">116 kWh</text>
<rect class="f-none s-muted" x="24" y="483" width="432" height="44" rx="2" stroke-width="1" stroke-dasharray="4 4"/>
<text class="w6 c-ink" x="40" y="510" font-size="15">009 AWD</text>
