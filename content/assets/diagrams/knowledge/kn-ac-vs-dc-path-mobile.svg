<svg xmlns="http://www.w3.org/2000/svg" class="zk zk-pair-narrow" viewBox="0 0 400 900" role="img" aria-labelledby="kn-ac-vs-dc-path-m-title kn-ac-vs-dc-path-m-desc">
<title id="kn-ac-vs-dc-path-m-title">AC and DC: where the conversion happens</title>
<desc id="kn-ac-vs-dc-path-m-desc">Two charging paths into the battery. AC: grid AC, wallbox or AC post with no conversion, car inlet, then the onboard charger converts AC to DC, limited to 11 or 22 kW on Zeekr, into the battery. DC fast charging: grid AC, a charger cabinet with a large converter turns AC into DC, a CCS2 cable and the car inlet carry DC straight to the battery, bypassing the onboard charger. Public DC chargers run 25 to 350 kW (RACV); the car limits it, for example up to 420 to 450 kW peak on the 7X (press-reported) and 150 kW on the X AWD and 009.</desc>
<defs>
