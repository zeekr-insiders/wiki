<svg xmlns="http://www.w3.org/2000/svg" class="zk " viewBox="0 0 480 789" role="img" aria-labelledby="kn-home-approval-flow-title kn-home-approval-flow-desc">
<title id="kn-home-approval-flow-title">Getting a home charger connected</title>
<desc id="kn-home-approval-flow-desc">Five steps to connect a home charger: 1 choose the charger size from the car's AC limit and your supply; 2 a licensed electrician inspects the mains, board and phases; 3 find out whether the network needs notification or approval, which varies by DNSP, and either notify only or apply and wait; 4 install and test; 5 charge. Rules differ by network and change, so check your DNSP.</desc>
<defs>
<style>
svg.zk{width:100%;height:auto;display:block;max-width:600px;--zk-invm:#A6A6A6}
svg.zk.zk-wide{max-width:none}
[data-md-color-scheme="slate"] svg.zk{--zk-invm:#595959}
.zk .bg{fill:var(--bg,#F2F2F2)}
.zk .f-bg{fill:var(--bg,#F2F2F2)}
.zk .f-panel{fill:var(--panel,#FFFFFF)}
.zk .f-ink{fill:var(--ink,#1A1A1A)}
.zk .f-muted{fill:var(--ink-muted,#595959)}
.zk .f-accent{fill:var(--accent-ink,#B03C00)}
.zk .f-tint{fill:var(--ink,#1A1A1A);fill-opacity:.06}
.zk .f-atint{fill:var(--accent-ink,#B03C00);fill-opacity:.10}
.zk .f-none{fill:none}
.zk .s-ink{stroke:var(--ink,#1A1A1A)}
.zk .s-muted{stroke:var(--ink-muted,#595959)}
.zk .s-line{stroke:var(--line-strong,rgba(26,26,26,.36))}
.zk .s-rule{stroke:var(--line,rgba(26,26,26,.14))}
.zk .s-accent{stroke:var(--accent-ink,#B03C00)}
.zk .s-bg{stroke:var(--bg,#F2F2F2)}
.zk .s-inv{stroke:var(--bg,#F2F2F2)}
.zk .icon{fill:none;stroke-linecap:round;stroke-linejoin:round}
.zk text{font-family:var(--font-body,'IBM Plex Sans Condensed','Arial Narrow',ui-sans-serif,sans-serif);font-weight:500}
.zk text.d{font-family:var(--font-display,'Space Grotesk',ui-sans-serif,system-ui,sans-serif)}
.zk text.w4{font-weight:400}.zk text.w6{font-weight:600}
.zk .c-ink{fill:var(--ink,#1A1A1A)}
.zk .c-muted{fill:var(--ink-muted,#595959)}
.zk .c-accent{fill:var(--accent-ink,#B03C00)}
.zk .c-inv{fill:var(--bg,#F2F2F2)}
.zk .c-invm{fill:var(--zk-invm)}
@media (max-width:599px){svg.zk-pair-wide{display:none}}
@media (min-width:600px){svg.zk-pair-narrow{display:none}}
</style>
<marker id="kn-home-approval-flow-a" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path class="f-muted" d="M0 0L8 4L0 8z"/></marker>
<marker id="kn-home-approval-flow-ai" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path class="f-ink" d="M0 0L10 5L0 10z"/></marker>
<marker id="kn-home-approval-flow-aa" markerWidth="14" markerHeight="12" refX="14" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path class="f-accent" d="M0 0L14 6L0 12z"/></marker>
<pattern id="kn-home-approval-flow-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" class="f-panel"/><line x1="0" y1="0" x2="0" y2="6" class="s-muted" stroke-width="2"/></pattern>
</defs>
<rect class="bg" width="480" height="789"/>
<text class="w6 c-muted" x="24" y="36" font-size="12" letter-spacing="0.14em">HOME CHARGING: GETTING CONNECTED</text>
<text class="d w6 c-ink" x="24" y="76" font-size="28">Check with the network first.</text>
<text class="c-muted" x="24" y="105" font-size="15">Your electrician tells you whether the network must be notified or</text>
<text class="c-muted" x="24" y="125" font-size="15">must approve the work.</text>
<text class="d w6 c-muted" x="24" y="187" font-size="32">1</text>
<rect class="f-panel s-line" x="72" y="157" width="384" height="66" rx="2" stroke-width="1"/>
<text class="d w6 c-ink" x="84" y="184.2" font-size="16">Choose charger size</text>
<text class="c-muted" x="84" y="206.2" font-size="14">Car AC limit, your supply</text>
<line class="s-muted" x1="264" y1="223" x2="264" y2="251" stroke-width="1.5" marker-end="url(#kn-home-approval-flow-a)"/>
<text class="d w6 c-muted" x="24" y="281" font-size="32">2</text>
<rect class="f-panel s-ink" x="72" y="251" width="384" height="66" rx="2" stroke-width="1.5"/>
<text class="d w6 c-ink" x="84" y="278.2" font-size="16">Licensed electrician inspects</text>
<text class="c-muted" x="84" y="300.2" font-size="14">Mains, board and phases</text>
<line class="s-muted" x1="264" y1="317" x2="264" y2="345" stroke-width="1.5" marker-end="url(#kn-home-approval-flow-a)"/>
<text class="d w6 c-accent" x="24" y="375" font-size="32">3</text>
<rect class="f-ink" x="72" y="345" width="384" height="90" rx="2"/>
<text class="d w6 c-inv" x="84" y="374.1" font-size="18">Does the network need notification or</text>
<text class="d w6 c-inv" x="84" y="396.1" font-size="18">approval?</text>
<text class="c-invm" x="84" y="418.1" font-size="14">Varies by DNSP</text>
<line class="s-muted" x1="164" y1="435" x2="164" y2="467" stroke-width="1.5" marker-end="url(#kn-home-approval-flow-a)"/>
<line class="s-muted" x1="364" y1="435" x2="364" y2="467" stroke-width="1.5" marker-end="url(#kn-home-approval-flow-a)"/>
<rect class="f-panel s-ink" x="72" y="467" width="184" height="44" rx="2" stroke-width="1.5"/>
<text class="d w6 c-ink" x="164" y="494.2" font-size="16" text-anchor="middle">Notify only</text>
<rect class="f-panel s-ink" x="272" y="467" width="184" height="44" rx="2" stroke-width="1.5"/>
<text class="d w6 c-ink" x="364" y="494.2" font-size="16" text-anchor="middle">Apply and wait</text>
<line class="s-muted" x1="164" y1="511" x2="164" y2="539" stroke-width="1.5" marker-end="url(#kn-home-approval-flow-a)"/>
<line class="s-muted" x1="364" y1="511" x2="364" y2="539" stroke-width="1.5" marker-end="url(#kn-home-approval-flow-a)"/>
<text class="d w6 c-muted" x="24" y="569" font-size="32">4</text>
<rect class="f-panel s-ink" x="72" y="539" width="384" height="44" rx="2" stroke-width="1.5"/>
<text class="d w6 c-ink" x="84" y="566.2" font-size="16">Install and test</text>
<line class="s-muted" x1="264" y1="583" x2="264" y2="611" stroke-width="1.5" marker-end="url(#kn-home-approval-flow-a)"/>
<text class="d w6 c-muted" x="24" y="641" font-size="32">5</text>
<rect class="f-panel s-ink" x="72" y="611" width="384" height="44" rx="2" stroke-width="1.5"/>
<text class="d w6 c-ink" x="84" y="638.2" font-size="16">Charge</text>
<rect class="f-tint" x="24" y="687" width="432" height="78" rx="2"/>
<g class="icon s-muted" stroke-width="1.8" transform="translate(36 699) scale(0.833333)" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></g>
<text class="c-muted" x="68" y="715" font-size="14">Rules differ by network and change. Check your DNSP.</text>
<text class="c-muted" x="68" y="733" font-size="14">Queensland has had specific single-phase rules, reported</text>
<text class="c-muted" x="68" y="751" font-size="14">changed 1 Oct 2026 (unconfirmed).</text>
</svg>
