<svg xmlns="http://www.w3.org/2000/svg" class="zk " viewBox="0 0 480 726" role="img" aria-labelledby="kn-v2x-three-way-title kn-v2x-three-way-desc">
<title id="kn-v2x-three-way-title">V2L, V2H and V2G: where the power goes</title>
<desc id="kn-v2x-three-way-desc">Three ways power can leave an EV battery. V2L goes to an appliance such as a camp fridge or tools, via the car socket or an adapter; Zeekr 7X and X give 3.3 kW, and it is available on both. V2H goes to the house switchboard through a bidirectional charger for backup power; not supported on Zeekr per sources, unconfirmed. V2G exports to the street network through the house meter and needs a certified charger and network approval; not supported on Zeekr per sources, unconfirmed, with trials in Australia on other cars.</desc>
