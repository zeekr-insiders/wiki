<svg xmlns="http://www.w3.org/2000/svg" class="zk " viewBox="0 0 480 664" role="img" aria-labelledby="kn-v2g-timeline-title kn-v2g-timeline-desc">
<title id="kn-v2g-timeline-title">V2G in Australia: milestones</title>
<desc id="kn-v2g-timeline-desc">Timeline of V2G in Australia: Nov 2024 Standards Australia approves a V2G standard; Jul 2025 Ausgrid connects its first V2G system, 7.4 kW, as a depot test; Jan 2026 Infypower 6.2 kW DC wallbox reported CEC-certified; Mar 2026 StarCharge Halo 7.4 kW CEC-listed; Apr 2026 NRMA lists 3 CEC-approved chargers and says warranty is the main barrier. As of Nov 2026 this wiki's research found no Zeekr confirmed for V2H or V2G.</desc>
<defs>
<style>
