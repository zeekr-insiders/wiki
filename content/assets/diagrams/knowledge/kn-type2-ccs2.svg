<text class="d w6 c-accent" x="268" y="312.2" font-size="16">CCS2 adds</text>
<text class="d w6 c-accent" x="268" y="332.2" font-size="16">two DC pins</text>
<line class="s-rule" x1="24" y1="364.2" x2="456" y2="364.2" stroke-width="1"/>
