<rect class="f-muted s-ink" x="265.2" y="480.36" width="61.6" height="30.8" rx="15.400000000000002" stroke-width="1.5"/>
<text class="c-muted" x="352" y="432.2" font-size="14">DC fast charger:</text>
<text class="c-muted" x="352" y="450.2" font-size="14">tethered cable</text>
