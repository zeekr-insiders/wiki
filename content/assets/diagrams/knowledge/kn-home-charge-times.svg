<svg xmlns="http://www.w3.org/2000/svg" class="zk " viewBox="0 0 480 858" role="img" aria-labelledby="kn-home-charge-times-title kn-home-charge-times-desc">
<title id="kn-home-charge-times-title">Hours to charge empty to full at home</title>
<desc id="kn-home-charge-times-desc">Grouped bar chart of hours to charge from empty to full at home, ideal case, calculated as kWh divided by kW before charging losses. 61 kWh X RWD: Portable 10 A 26.5 h, 7 kW 8.7 h, 11 kW 5.5 h, 22 kW limited by the car's AC rate. 66 kWh X AWD: Portable 10 A 28.7 h, 7 kW 9.4 h, 11 kW 6.0 h, 22 kW 3.0 h. 75 kWh 7X RWD: Portable 10 A 32.6 h, 7 kW 10.7 h, 11 kW 6.8 h, 22 kW 3.4 h. 100 kWh 7X LR/AWD: Portable 10 A 43.5 h, 7 kW 14.3 h, 11 kW 9.1 h, 22 kW 4.5 h. 116 kWh 009 FWD: Portable 10 A 50.4 h, 7 kW 16.6 h, 11 kW 10.5 h, 22 kW limited by the car's AC rate. A 10-hour line marks a typical overnight window. Portable 10 A is about 2.3 kW.</desc>
<defs>
<style>
svg.zk{width:100%;height:auto;display:block;max-width:600px;--zk-invm:#A6A6A6}
svg.zk.zk-wide{max-width:none}
[data-md-color-scheme="slate"] svg.zk{--zk-invm:#595959}
.zk .bg{fill:var(--bg,#F2F2F2)}
.zk .f-bg{fill:var(--bg,#F2F2F2)}
.zk .f-panel{fill:var(--panel,#FFFFFF)}
