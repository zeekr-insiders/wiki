<svg xmlns="http://www.w3.org/2000/svg" class="zk zk-wide zk-pair-wide" viewBox="0 0 800 632" role="img" aria-labelledby="kn-home-supply-title kn-home-supply-desc">
<title id="kn-home-supply-title">From the street to your car: single-phase vs three-phase</title>
<desc id="kn-home-supply-desc">Power reaches a home charger through the street network (DNSP), the service cable, the meter, the switchboard (main switch, RCD and EV circuit breaker), the wallbox (EVSE) and the car's onboard charger. Single-phase is one live plus neutral: a 32 A circuit gives about 7.4 kW at most. Three-phase is three lives plus neutral: about 11 kW on a 16 A circuit and about 22 kW on 32 A. Figures are nominal, calculated at 230 V and 400 V. A licensed electrician checks the mains cable and board, the network may need notification or approval, and the car's own limit still applies: X RWD 11 kW, 7X 22 kW AC.</desc>
<defs>
