<svg xmlns="http://www.w3.org/2000/svg" class="zk " viewBox="0 0 480 588" role="img" aria-labelledby="kn-charging-curve-title kn-charging-curve-desc">
<title id="kn-charging-curve-title">A generic DC charging curve (illustrative)</title>
<desc id="kn-charging-curve-desc">Illustrative line chart of DC charging power against state of charge: power rises quickly to a peak by about 10%, holds near it to about 50 to 60%, steps down, then falls steeply after 80% to a trickle at 100%. The 10 to 80% band is where most of the energy is added; the last 20% is slow. Zeekr quotes 10 to 80% in about 10 to 16 minutes for the 7X and about 30 minutes for the 009 FWD. Shape is not measured data.</desc>
<defs>
<style>
svg.zk{width:100%;height:auto;display:block;max-width:600px;--zk-invm:#A6A6A6}
svg.zk.zk-wide{max-width:none}
[data-md-color-scheme="slate"] svg.zk{--zk-invm:#595959}
.zk .bg{fill:var(--bg,#F2F2F2)}
.zk .f-bg{fill:var(--bg,#F2F2F2)}
.zk .f-panel{fill:var(--panel,#FFFFFF)}
.zk .f-ink{fill:var(--ink,#1A1A1A)}
.zk .f-muted{fill:var(--ink-muted,#595959)}
.zk .f-accent{fill:var(--accent-ink,#B03C00)}
.zk .f-tint{fill:var(--ink,#1A1A1A);fill-opacity:.06}
.zk .f-atint{fill:var(--accent-ink,#B03C00);fill-opacity:.10}
.zk .f-none{fill:none}
.zk .s-ink{stroke:var(--ink,#1A1A1A)}
.zk .s-muted{stroke:var(--ink-muted,#595959)}
.zk .s-line{stroke:var(--line-strong,rgba(26,26,26,.36))}
.zk .s-rule{stroke:var(--line,rgba(26,26,26,.14))}
.zk .s-accent{stroke:var(--accent-ink,#B03C00)}
.zk .s-bg{stroke:var(--bg,#F2F2F2)}
.zk .s-inv{stroke:var(--bg,#F2F2F2)}
.zk .icon{fill:none;stroke-linecap:round;stroke-linejoin:round}
.zk text{font-family:var(--font-body,'IBM Plex Sans Condensed','Arial Narrow',ui-sans-serif,sans-serif);font-weight:500}
.zk text.d{font-family:var(--font-display,'Space Grotesk',ui-sans-serif,system-ui,sans-serif)}
.zk text.w4{font-weight:400}.zk text.w6{font-weight:600}
.zk .c-ink{fill:var(--ink,#1A1A1A)}
.zk .c-muted{fill:var(--ink-muted,#595959)}
.zk .c-accent{fill:var(--accent-ink,#B03C00)}
.zk .c-inv{fill:var(--bg,#F2F2F2)}
.zk .c-invm{fill:var(--zk-invm)}
@media (max-width:599px){svg.zk-pair-wide{display:none}}
@media (min-width:600px){svg.zk-pair-narrow{display:none}}
</style>
<marker id="kn-charging-curve-a" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path class="f-muted" d="M0 0L8 4L0 8z"/></marker>
<marker id="kn-charging-curve-ai" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path class="f-ink" d="M0 0L10 5L0 10z"/></marker>
<marker id="kn-charging-curve-aa" markerWidth="14" markerHeight="12" refX="14" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path class="f-accent" d="M0 0L14 6L0 12z"/></marker>
<pattern id="kn-charging-curve-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" class="f-panel"/><line x1="0" y1="0" x2="0" y2="6" class="s-muted" stroke-width="2"/></pattern>
</defs>
<rect class="bg" width="480" height="588"/>
<text class="w6 c-muted" x="24" y="36" font-size="12" letter-spacing="0.14em">CHARGING BASICS: THE DC CURVE</text>
<text class="d w6 c-ink" x="24" y="80" font-size="32">10 to 80% is the fast part.</text>
<text class="c-muted" x="24" y="109" font-size="15">Power ramps up, holds near a peak, then tapers as the battery fills.</text>
<text class="w6 c-muted" x="24" y="156" font-size="14">Power (illustrative)</text>
<rect class="f-none s-line" x="191.781" y="142" width="264.219" height="19" rx="2" stroke-width="1"/>
<text class="w6 c-muted" x="197.781" y="155.46" font-size="11" letter-spacing="0.1em">ILLUSTRATIVE SHAPE, NOT MEASURED DATA</text>
<rect class="f-atint" x="81.6" y="172" width="291.2" height="188" rx="0"/>
<text class="w6 c-accent" x="93.6" y="194" font-size="14">The fast part: where most of the energy is</text>
<text class="w6 c-accent" x="93.6" y="212" font-size="14">added</text>
<line class="s-line" x1="40" y1="172" x2="40" y2="360" stroke-width="1"/>
<path class="f-none s-ink" d="M40.0 318.0 C43.5 312.2 53.9 298.6 60.8 283.0 C67.7 267.4 71.2 234.7 81.6 224.2 C92.0 213.7 102.4 220.5 123.2 220.0 C144.0 219.5 182.1 220.5 206.4 221.4 C230.7 222.3 253.5 222.1 268.8 225.6 C284.1 229.1 287.5 237.3 297.9 242.4 C308.3 247.5 320.1 251.3 331.2 256.4 C342.3 261.5 355.5 265.3 364.5 273.2 C373.5 281.1 378.3 295.6 385.3 304.0 C392.2 312.4 398.5 317.8 406.1 323.6 C413.7 329.4 422.7 334.8 431.0 339.0 C439.4 343.2 451.8 347.2 456.0 348.8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<line class="s-ink" x1="40" y1="360" x2="456" y2="360" stroke-width="1.5"/>
<line class="s-ink" x1="40" y1="360" x2="40" y2="366" stroke-width="1.5"/>
<text class="c-muted" x="40" y="384" font-size="14">0%</text>
<line class="s-ink" x1="81.6" y1="360" x2="81.6" y2="366" stroke-width="1.5"/>
<text class="c-muted" x="81.6" y="384" font-size="14" text-anchor="middle">10%</text>
<line class="s-ink" x1="372.8" y1="360" x2="372.8" y2="366" stroke-width="1.5"/>
<text class="c-muted" x="372.8" y="384" font-size="14" text-anchor="middle">80%</text>
<line class="s-ink" x1="456" y1="360" x2="456" y2="366" stroke-width="1.5"/>
<text class="c-muted" x="456" y="384" font-size="14" text-anchor="end">100%</text>
<text class="w6 c-muted" x="456" y="406" font-size="14" text-anchor="end">State of charge</text>
<circle class="f-ink" cx="189.76" cy="250" r="10"/>
<text class="d w6 c-inv" x="189.76" y="254.5" font-size="13" text-anchor="middle">1</text>
<circle class="f-ink" cx="322.88" cy="229.6" r="10"/>
<text class="d w6 c-inv" x="322.88" y="234.1" font-size="13" text-anchor="middle">2</text>
<circle class="f-ink" cx="422.72" cy="308.8" r="10"/>
<text class="d w6 c-inv" x="422.72" y="313.3" font-size="13" text-anchor="middle">3</text>
<circle class="f-ink" cx="34" cy="441" r="10"/>
<text class="d w6 c-inv" x="34" y="445.5" font-size="13" text-anchor="middle">1</text>
<text class="c-ink" x="56" y="446" font-size="15">Peak power only for a short stretch</text>
<circle class="f-ink" cx="34" cy="471" r="10"/>
<text class="d w6 c-inv" x="34" y="475.5" font-size="13" text-anchor="middle">2</text>
<text class="c-ink" x="56" y="476" font-size="15">Taper protects the cells (voltage and heat)</text>
<circle class="f-ink" cx="34" cy="501" r="10"/>
<text class="d w6 c-inv" x="34" y="505.5" font-size="13" text-anchor="middle">3</text>
<text class="c-ink" x="56" y="506" font-size="15">Last 20% is slow</text>
<line class="s-rule" x1="24" y1="532" x2="456" y2="532" stroke-width="1"/>
<text class="c-muted" x="24" y="556" font-size="14">Zeekr quotes 10-80% in about 10-16 minutes for the 7X, about 30</text>
<text class="c-muted" x="24" y="574" font-size="14">minutes for the 009 FWD.</text>
</svg>
