<svg xmlns="http://www.w3.org/2000/svg" class="zk " viewBox="0 0 480 843" role="img" aria-labelledby="kn-charge-limit-decision-title kn-charge-limit-decision-desc">
<title id="kn-charge-limit-decision-title">What should I set my charge limit to?</title>
<desc id="kn-charge-limit-decision-desc">Decision flowchart for a daily charge limit. First find which battery your Zeekr has. NMC: a daily limit of about 80% to 90%; if a long trip is tomorrow, charge to 100% shortly before you leave, otherwise stay at the daily limit. LFP: daily at the manufacturer-permitted limit, often 100% (general industry practice, not Zeekr-confirmed), and charge to 100% at least weekly for calibration. In both cases your Zeekr manual and in-car settings override the chart.</desc>
<defs>
<style>
svg.zk{width:100%;height:auto;display:block;max-width:600px;--zk-invm:#A6A6A6}
svg.zk.zk-wide{max-width:none}
[data-md-color-scheme="slate"] svg.zk{--zk-invm:#595959}
.zk .bg{fill:var(--bg,#F2F2F2)}
.zk .f-bg{fill:var(--bg,#F2F2F2)}
.zk .f-panel{fill:var(--panel,#FFFFFF)}
.zk .f-ink{fill:var(--ink,#1A1A1A)}
.zk .f-muted{fill:var(--ink-muted,#595959)}
.zk .f-accent{fill:var(--accent-ink,#B03C00)}
.zk .f-tint{fill:var(--ink,#1A1A1A);fill-opacity:.06}
.zk .f-atint{fill:var(--accent-ink,#B03C00);fill-opacity:.10}
.zk .f-none{fill:none}
.zk .s-ink{stroke:var(--ink,#1A1A1A)}
.zk .s-muted{stroke:var(--ink-muted,#595959)}
.zk .s-line{stroke:var(--line-strong,rgba(26,26,26,.36))}
.zk .s-rule{stroke:var(--line,rgba(26,26,26,.14))}
.zk .s-accent{stroke:var(--accent-ink,#B03C00)}
.zk .s-bg{stroke:var(--bg,#F2F2F2)}
.zk .s-inv{stroke:var(--bg,#F2F2F2)}
.zk .icon{fill:none;stroke-linecap:round;stroke-linejoin:round}
.zk text{font-family:var(--font-body,'IBM Plex Sans Condensed','Arial Narrow',ui-sans-serif,sans-serif);font-weight:500}
.zk text.d{font-family:var(--font-display,'Space Grotesk',ui-sans-serif,system-ui,sans-serif)}
.zk text.w4{font-weight:400}.zk text.w6{font-weight:600}
.zk .c-ink{fill:var(--ink,#1A1A1A)}
.zk .c-muted{fill:var(--ink-muted,#595959)}
.zk .c-accent{fill:var(--accent-ink,#B03C00)}
.zk .c-inv{fill:var(--bg,#F2F2F2)}
.zk .c-invm{fill:var(--zk-invm)}
@media (max-width:599px){svg.zk-pair-wide{display:none}}
@media (min-width:600px){svg.zk-pair-narrow{display:none}}
</style>
<marker id="kn-charge-limit-decision-a" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path class="f-muted" d="M0 0L8 4L0 8z"/></marker>
<marker id="kn-charge-limit-decision-ai" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path class="f-ink" d="M0 0L10 5L0 10z"/></marker>
<marker id="kn-charge-limit-decision-aa" markerWidth="14" markerHeight="12" refX="14" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path class="f-accent" d="M0 0L14 6L0 12z"/></marker>
<pattern id="kn-charge-limit-decision-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" class="f-panel"/><line x1="0" y1="0" x2="0" y2="6" class="s-muted" stroke-width="2"/></pattern>
</defs>
<rect class="bg" width="480" height="843"/>
<text class="w6 c-muted" x="24" y="36" font-size="12" letter-spacing="0.14em">CHARGING TO 80% VS 100%</text>
<text class="d w6 c-ink" x="24" y="76" font-size="28">Charge to 80% is only half right.</text>
<text class="c-muted" x="24" y="105" font-size="15">The right daily limit depends on your battery.</text>
<rect class="f-panel s-line" x="24" y="137" width="432" height="66" rx="2" stroke-width="1"/>
<text class="d w6 c-ink" x="36" y="164.2" font-size="16">Which battery is in my Zeekr?</text>
<text class="c-muted" x="36" y="186.2" font-size="14">See the NMC vs LFP page</text>
<line class="s-muted" x1="240" y1="203" x2="240" y2="227" stroke-width="1.5" marker-end="url(#kn-charge-limit-decision-a)"/>
<path class="f-panel s-accent" d="M240 227.0L340.0 267L240 307.0L140.0 267Z" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="round"/>
<text class="d w6 c-ink" x="240" y="272.95" font-size="17" text-anchor="middle">NMC or LFP?</text>
<path class="f-none s-muted" d="M140 267L134.0 267Q126.0 267 126.0 275L126.0 355" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#kn-charge-limit-decision-a)"/>
<path class="f-none s-muted" d="M340 267L346.0 267Q354.0 267 354.0 275L354.0 355" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#kn-charge-limit-decision-a)"/>
<text class="w6 c-ink" x="118" y="303" font-size="14" letter-spacing="0.08em" text-anchor="end">NMC</text>
<text class="w6 c-ink" x="362" y="303" font-size="14" letter-spacing="0.08em">LFP</text>
<rect class="f-panel s-ink" x="24" y="355" width="204" height="64" rx="2" stroke-width="1.5"/>
<text class="d w6 c-ink" x="36" y="382.2" font-size="16">Daily: about 80% to</text>
<text class="d w6 c-ink" x="36" y="402.2" font-size="16">90%</text>
<line class="s-muted" x1="126" y1="419" x2="126" y2="443" stroke-width="1.5" marker-end="url(#kn-charge-limit-decision-a)"/>
<path class="f-panel s-ink" d="M126.0 443.0L216.0 479L126.0 515.0L36.0 479Z" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="round"/>
<text class="d w6 c-ink" x="126" y="475.25" font-size="15" text-anchor="middle">Long trip</text>
<text class="d w6 c-ink" x="126" y="493.25" font-size="15" text-anchor="middle">tomorrow?</text>
<line class="s-muted" x1="126" y1="515" x2="126" y2="539" stroke-width="1.5" marker-end="url(#kn-charge-limit-decision-a)"/>
<rect class="f-panel s-ink" x="24" y="539" width="204" height="84" rx="2" stroke-width="1.5"/>
<text class="d w6 c-ink" x="36" y="566.2" font-size="16">Yes: charge to 100%</text>
<text class="d w6 c-ink" x="36" y="586.2" font-size="16">shortly before you</text>
<text class="d w6 c-ink" x="36" y="606.2" font-size="16">leave</text>
<rect class="f-panel s-line" x="24" y="647" width="204" height="64" rx="2" stroke-width="1"/>
<text class="d w6 c-ink" x="36" y="674.2" font-size="16">No: stay at your daily</text>
<text class="d w6 c-ink" x="36" y="694.2" font-size="16">limit</text>
<path class="f-none s-muted" d="M216.0 479L232 479Q240 479 240 487L240 671.0Q240 679.0 232 679.0L228 679.0" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#kn-charge-limit-decision-a)"/>
<rect class="f-panel s-muted" x="252" y="355" width="204" height="124" rx="2" stroke-width="1.5" stroke-dasharray="5 4"/>
<text class="d w6 c-ink" x="264" y="382.2" font-size="16">Daily: the maker's</text>
<text class="d w6 c-ink" x="264" y="402.2" font-size="16">permitted limit, often</text>
<text class="d w6 c-ink" x="264" y="422.2" font-size="16">100%</text>
<text class="c-muted" x="264" y="444.2" font-size="14">General practice, not</text>
<text class="c-muted" x="264" y="462.2" font-size="14">Zeekr-confirmed</text>
<line class="s-muted" x1="354" y1="479" x2="354" y2="503" stroke-width="1.5" marker-end="url(#kn-charge-limit-decision-a)"/>
<rect class="f-panel s-ink" x="252" y="503" width="204" height="86" rx="2" stroke-width="1.5"/>
<text class="d w6 c-ink" x="264" y="530.2" font-size="16">Charge to 100% at</text>
<text class="d w6 c-ink" x="264" y="550.2" font-size="16">least weekly</text>
<text class="c-muted" x="264" y="572.2" font-size="14">Calibration</text>
<path class="f-none s-muted" d="M126.0 711L126.0 751" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#kn-charge-limit-decision-a)"/>
<path class="f-none s-muted" d="M354.0 589L354.0 751" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#kn-charge-limit-decision-a)"/>
<rect class="f-ink" x="24" y="751" width="432" height="68" rx="2"/>
<text class="d w6 c-inv" x="36" y="780.1" font-size="18">Your Zeekr manual and in-car settings</text>
<text class="d w6 c-inv" x="36" y="802.1" font-size="18">override this chart</text>
</svg>
