<svg xmlns="http://www.w3.org/2000/svg" class="zk " viewBox="0 0 480 772" role="img" aria-labelledby="kn-nmc-lfp-compare-title kn-nmc-lfp-compare-desc">
<title id="kn-nmc-lfp-compare-title">NMC vs LFP at a glance</title>
<desc id="kn-nmc-lfp-compare-desc">Range bars comparing NMC and LFP cells, each metric on one scale from zero. Specific energy: NMC 150 to 220 Wh/kg, LFP 90 to 120. Cycle life: NMC 1,000 to 2,000, LFP 2,000 and more. Nominal cell voltage: NMC 3.6 to 3.7 V, LFP 3.2 to 3.3 V. Thermal runaway onset: NMC about 210 degrees C, LFP about 270. NMC is lighter for the same energy; LFP is tougher and lasts more cycles. Cell-level figures from Battery University; pack-level results differ by maker.</desc>
<defs>
<style>
svg.zk{width:100%;height:auto;display:block;max-width:600px;--zk-invm:#A6A6A6}
svg.zk.zk-wide{max-width:none}
[data-md-color-scheme="slate"] svg.zk{--zk-invm:#595959}
.zk .bg{fill:var(--bg,#F2F2F2)}
.zk .f-bg{fill:var(--bg,#F2F2F2)}
.zk .f-panel{fill:var(--panel,#FFFFFF)}
.zk .f-ink{fill:var(--ink,#1A1A1A)}
.zk .f-muted{fill:var(--ink-muted,#595959)}
.zk .f-accent{fill:var(--accent-ink,#B03C00)}
.zk .f-tint{fill:var(--ink,#1A1A1A);fill-opacity:.06}
.zk .f-atint{fill:var(--accent-ink,#B03C00);fill-opacity:.10}
.zk .f-none{fill:none}
.zk .s-ink{stroke:var(--ink,#1A1A1A)}
.zk .s-muted{stroke:var(--ink-muted,#595959)}
.zk .s-line{stroke:var(--line-strong,rgba(26,26,26,.36))}
.zk .s-rule{stroke:var(--line,rgba(26,26,26,.14))}
.zk .s-accent{stroke:var(--accent-ink,#B03C00)}
.zk .s-bg{stroke:var(--bg,#F2F2F2)}
.zk .s-inv{stroke:var(--bg,#F2F2F2)}
.zk .icon{fill:none;stroke-linecap:round;stroke-linejoin:round}
.zk text{font-family:var(--font-body,'IBM Plex Sans Condensed','Arial Narrow',ui-sans-serif,sans-serif);font-weight:500}
.zk text.d{font-family:var(--font-display,'Space Grotesk',ui-sans-serif,system-ui,sans-serif)}
.zk text.w4{font-weight:400}.zk text.w6{font-weight:600}
.zk .c-ink{fill:var(--ink,#1A1A1A)}
.zk .c-muted{fill:var(--ink-muted,#595959)}
.zk .c-accent{fill:var(--accent-ink,#B03C00)}
.zk .c-inv{fill:var(--bg,#F2F2F2)}
.zk .c-invm{fill:var(--zk-invm)}
@media (max-width:599px){svg.zk-pair-wide{display:none}}
@media (min-width:600px){svg.zk-pair-narrow{display:none}}
</style>
<marker id="kn-nmc-lfp-compare-a" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path class="f-muted" d="M0 0L8 4L0 8z"/></marker>
<marker id="kn-nmc-lfp-compare-ai" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path class="f-ink" d="M0 0L10 5L0 10z"/></marker>
<marker id="kn-nmc-lfp-compare-aa" markerWidth="14" markerHeight="12" refX="14" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path class="f-accent" d="M0 0L14 6L0 12z"/></marker>
<pattern id="kn-nmc-lfp-compare-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" class="f-panel"/><line x1="0" y1="0" x2="0" y2="6" class="s-muted" stroke-width="2"/></pattern>
</defs>
<rect class="bg" width="480" height="772"/>
<text class="w6 c-muted" x="24" y="36" font-size="12" letter-spacing="0.14em">BATTERY CHEMISTRY: NMC VS LFP</text>
<text class="d w6 c-ink" x="24" y="80" font-size="32">NMC is lighter. LFP lasts</text>
<text class="d w6 c-ink" x="24" y="115" font-size="32">longer.</text>
<text class="c-muted" x="24" y="144" font-size="15">Bars show the range each source gives, on a scale from 0.</text>
