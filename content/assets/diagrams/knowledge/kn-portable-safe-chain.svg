<svg xmlns="http://www.w3.org/2000/svg" class="zk " viewBox="0 0 480 657" role="img" aria-labelledby="kn-portable-safe-chain-title kn-portable-safe-chain-desc">
<title id="kn-portable-safe-chain-title">Portable charger: the safe chain</title>
<desc id="kn-portable-safe-chain-desc">The one safe connection: a good wall socket on an RCD-protected circuit, then the portable charger (10 A or 15 A as matched to the outlet), then the car's Type 2 inlet. Not allowed: wall socket, then an extension lead, adapter or multi-port board, then the portable charger; the Zeekr manual says no adapters, extension cables or multiple ports. If the socket is too far or unsuitable, get a licensed electrician to fit a dedicated outlet or wallbox.</desc>
<defs>
