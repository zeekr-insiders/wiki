    # Drivetrain specifications
    drivetrain:
      layout: "RWD"
      motors:
        - axle: "rear"
          power_kw: 310
          torque_nm: 440

    system_output:
      power_kw: 310
      power_hp: 415
      torque_nm: 440

    # Performance metrics
    performance:
      zero_to_100_s: 6.0
