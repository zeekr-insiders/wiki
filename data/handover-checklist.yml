items:
  - id: pre-app-chargefox
    section: pre-apps
    text: "Install Chargefox and create your account"
    hint: "Sign up in the app. Add a payment card now, not standing at a charger."
    models: ["all"]
    cite: [chargefox]
  - id: pre-app-evie
    section: pre-apps
    text: "Install Evie and create your account"
    hint: "Same again: do it at home on wifi. Ampol agreed in October 2026 to buy Evie; until the deal completes, expected in the first half of 2027, the two networks run separately."
    models: ["all"]
    cite: [evie, thedriven-ampol-evie]
  - id: pre-app-nrma
    section: pre-apps
    text: "Install My NRMA and set up your account"
    hint: "Sessions have to start in the My NRMA app to get the member price. Some sites take tap and pay."
    models: ["all"]
    states: [NSW, VIC, QLD, SA, TAS, ACT, NT]
    cite: [nrma]
  - id: pre-app-jolt
    section: pre-apps
    text: "Install JOLT if it has sites near you"
    hint: "Registration is in the app; you start a session by QR code or the code on the charger."
    models: ["all"]
    cite: [jolt]
  - id: pre-app-finder
    section: pre-apps
    text: "Install PlugShare or A Better Route Planner to find chargers"
    hint: "Both show chargers across the networks. The ACT and SA governments point drivers to PlugShare; RACQ suggests A Better Route Planner."
    models: ["all"]
    cite: [act-chargers, sa-charging, racq-charging]
  - id: pre-app-vic
    section: pre-apps
    text: "RACV member? Add your number in Chargefox"
    hint: "RACV members get 10% off charging through Chargefox."
    models: ["all"]
    states: [VIC]
    cite: [racv-chargefox]
  - id: pre-app-qld
    section: pre-apps
    text: "Queensland Electric Super Highway: use your Chargefox account"
    hint: "The state's highway network runs through Chargefox. RACQ members get 4c/kWh off at selected Evie sites in Queensland: link your membership in the Evie app."
    models: ["all"]
    states: [QLD]
    cite: [yurika-qesh, racq-charging]
  - id: pre-app-wa
    section: pre-apps
    text: "WA EV Network: use your Chargefox account"
    hint: "Synergy and Horizon Power's network (110 fast chargers at 49 locations) runs through Chargefox. RAC members get 20% off at RAC-owned chargers once their number is in Chargefox."
    models: ["all"]
    states: [WA]
    cite: [horizon-wa, synergy-wa, rac-chargefox]
  - id: pre-app-sa
    section: pre-apps
    text: "Find RAA Charge sites on the RAA website or PlugShare"
    hint: "RAA Charge is South Australia's statewide network."
    models: ["all"]
    states: [SA]
    cite: [sa-charging]
  - id: pre-app-tas
    section: pre-apps
    text: "Tasmania's Electric Highway: use Chargefox"
    hint: "NRMA has run it since 1 September 2025, through the Chargefox app or a Chargefox RFID card. Evie and Tesla have sites in Tasmania too."
    models: ["all"]
    states: [TAS]
    cite: [nrma-tas, recfit-tas]
  - id: pre-app-act
    section: pre-apps
    text: "Canberra: check which operators run your local chargers"
    hint: "ACT public chargers come from several operators, including Evie, NRMA, BP Pulse and ActewAGL, so you may want more than one app."
    models: ["all"]
    states: [ACT]
    cite: [act-chargers]
  - id: pre-app-nt
    section: pre-apps
    text: "Plan around NRMA's highway chargers"
    hint: "NRMA has fast chargers in Katherine, Tennant Creek and Alice Springs. Plan any trip out of town around them before you go."
    models: ["all"]
    states: [NT]
    cite: [katherine-nt]
  - id: pre-app-rfid
    section: pre-apps
    text: "Ask each network if it offers an RFID card or tag"
    hint: "App-only works for most people. A card or tag is a handy backup if your phone is flat."
    models: ["all"]
  - id: pre-video
    section: pre-prep
    text: "Watch before you go: Nate's Tech & Torque 7X handover video"
    hint: "A full 7X handover covering the infotainment and the Zeekr app. It shows the MY25/MY26 car."
    models: ["7x"]
    cite: [nate-handover]
    link: {label: "Watch it below", page: "#watch-before-you-go"}
  - id: pre-zeekr-app
    section: pre-prep
    text: "Install the Zeekr app and create your account"
    hint: "Done before the day, you can pair the car in minutes instead of waiting on a sign-up email."
    models: ["all"]
    cite: [nate-handover]
  - id: pre-licence
    section: pre-prep
    text: "Driver's licence in your wallet"
    hint: "Use the licence of the person who is insured."
    models: ["all"]
  - id: pre-insurance
    section: pre-prep
    text: "Comprehensive insurance starts on delivery day"
    hint: "Keep the confirmation on your phone. Give the insurer the VIN as soon as you have it."
    models: ["all"]
  - id: pre-payment
    section: pre-prep
    text: "Final payment or finance confirmed in writing"
    hint: "Bank transfer receipt or finance approval, saved on your phone."
    models: ["all"]
  - id: pre-time
    section: pre-prep
    text: "Booked a daylight slot and allowed an hour or two"
    hint: "A rushed handover is how things get missed. Ask the dealer to book you in properly."
    models: ["all"]
  - id: pre-order-copy
    section: pre-prep
    text: "Your order, spec and any promised extras saved on your phone"
    hint: "You will check the car and the paperwork against this."
    models: ["all"]
  - id: pre-model-year
    section: pre-prep
    text: "Confirmed in writing which model year you are getting"
    hint: "MY25/MY26 and MY27 differ in features and look."
    models: ["7x"]
    cite: [carexpert-7x]
    link: {label: "Which 7X do I have?", page: "models/7x/which-7x.md"}
  - id: pre-model-year-x
    section: pre-prep
    text: "Confirmed in writing whether your X is an MY25 or MY26"
    hint: "The MY26 has a redesigned centre console and touch shortcuts on the steering wheel, and the MY26 AWD has a fridge under the front armrest."
    models: ["x"]
    cite: [carexpert-x-quick, carexpert-x]
  - id: pre-offer-terms
    section: pre-prep
    text: "Launch offer terms in writing"
    hint: "The MY27 launch offer (orders 1 November to 31 December 2026, not demonstrators) lists two years of servicing, a 7 kW wallbox (supply only), free colour choice and 5,000 Zeekr app points."
    models: ["7x-my27"]
    cite: [zeekr-offers, zecar-my27, carexpert-7x]
  - id: pre-nt-rego
    section: pre-prep
    text: "Register before 30 June 2027 to get the NT's EV concessions"
    hint: "Rego fees are waived for EVs until then, and the first $50,000 of the car's value is free of stamp duty (up to $1,500) for registrations up to that date."
    models: ["all"]
    states: [NT]
    cite: [nt-duty, pwc-nt]
  - id: pre-home-charger
    section: pre-plan
    text: "Home charger booked or installed if you need one"
    hint: "A licensed electrician does the install. See the quote checklist in Home charging."
    models: ["all"]
    link: {label: "Home charging", page: "guides/charging/home-setup.md"}
  - id: pre-home-wallbox
    section: pre-plan
    text: "MY27 launch wallbox: arrange an electrician"
    hint: "The offer covers the wallbox only. Installation is at your cost."
    models: ["7x-my27"]
    cite: [zecar-my27, carexpert-7x]
  - id: pre-home-portable
    section: pre-plan
    text: "Portable charger: plug it straight into a wall socket"
    hint: "The 7X manual says no adapters, extension cables or multiple ports. Install a proper outlet if the socket is too far."
    models: ["7x"]
    cite: [manual-charging]
  - id: pre-act-shs
    section: pre-plan
    text: "Look at a Sustainable Household Scheme loan for your home charger"
    hint: "The ACT's low-interest loans cover home EV chargers as well as cars. New applicants can borrow up to $20,000."
    models: ["all"]
    states: [ACT]
    cite: [act-shs]
  - id: pre-tariff-eme
    section: pre-plan
    text: "Compare EV and time-of-use power plans on Energy Made Easy"
    hint: "The government comparison site. Some EV plans need the car registered at your address, which the comparison may not show."
    models: ["all"]
    states: [NSW, QLD, SA, TAS, ACT]
    cite: [energy-made-easy, nrma-ev-plans]
  - id: pre-tariff-vic
    section: pre-plan
    text: "Compare EV and time-of-use power plans on Victorian Energy Compare"
    hint: "Victoria's government comparison site. Some EV plans need the car registered at your address."
    models: ["all"]
    states: [VIC]
    cite: [vic-energy-compare, energy-made-easy, nrma-ev-plans]
  - id: pre-tariff-wa
    section: pre-plan
    text: "Synergy customer? Look at the EV Add On plan"
    hint: "Cheap overnight and midday rates for homes with an EV registered there. Peak costs more than the standard plan, and you may need a meter change."
    models: ["all"]
    states: [WA]
    cite: [synergy-ev-addon]
  - id: pre-tariff-nt
    section: pre-plan
    text: "Look at Jacana Energy's time-of-use tariff"
    hint: "Its cheap period is the middle of the day (9am to 3pm), not overnight. It needs a smart meter."
    models: ["all"]
    states: [NT]
    cite: [jacana-tou]
  - id: pre-drive-plan
    section: pre-plan
    text: "Plan the drive home and where you will first charge"
    hint: "Pick a charger on or near the route and check you have its app set up."
    models: ["all"]
  - id: paper-invoice
    section: paper
    text: "Invoice matches your order"
    hint: "Check variant, colour, extras, and the drive-away price breakdown."
    models: ["all"]
  - id: paper-vin
    section: paper
    text: "VIN on every document matches the car"
    hint: "Check the invoice, rego papers and insurance against the VIN on the car."
    models: ["all"]
  - id: paper-rego
    section: paper
    text: "Registration papers handed over"
    hint: "Or confirm in writing when and how they arrive."
    models: ["all"]
  - id: paper-booklet
    section: paper
    text: "Service & Warranty Booklet received (or digital copy)"
    hint: "Zeekr's warranty policy refers to it for the service schedule and you show it when claiming."
    models: ["all"]
    cite: [warranty]
  - id: paper-warranty
    section: paper
    text: "Ask what your warranty is, and get any extras in writing"
    hint: "Zeekr's standard terms are 5 years / unlimited km, 8 years / 160,000 km on the high-voltage battery. Launch offers can add to this, so check your contract."
    models: ["all"]
    cite: [warranty, zeekr-7x, carexpert-7x-launch]
  - id: paper-roadside
    section: paper
    text: "Zeekr Roadside 1800 093 357 saved in your phone"
    hint: "24 hours a day, 7 days a week. Have your VIN and location ready when you call."
    models: ["all"]
    cite: [zeekr-service]
  - id: paper-compliance
    section: paper
    text: "Compliance plate and build date photographed"
    hint: "Handy later for working out which model year you have."
    models: ["7x"]
    link: {label: "Which 7X do I have?", page: "models/7x/which-7x.md"}
  - id: paper-manual
    section: paper
    text: "Owner's manual in the car or digital access confirmed"
    hint: "Ask where it lives. For the 7X, Zeekr Europe has the 2025 manual (European edition) online."
    cite: [zeekr-eu-manual]
    models: ["all"]
  - id: paper-accessories
    section: paper
    text: "Dealer-fitted accessories listed on the invoice"
    hint: "Accessories fitted before delivery by an authorised dealer carry the full vehicle warranty. Fitted afterwards, 24 months / 20,000 km."
    models: ["all"]
    cite: [warranty]
  - id: ext-paint
    section: ext
    text: "Paint: scratches, chips, swirl marks, repaired-looking patches"
    hint: "Crouch and look along each panel. Check the roof and lower edges."
    models: ["all"]
  - id: ext-gaps
    section: ext
    text: "Panel gaps look even all round"
    hint: "Check bonnet, doors and tailgate."
    models: ["all"]
  - id: ext-colour
    section: ext
    text: "Colour matches your order"
    hint: "Compare against the invoice. Optional colours were free during launch offers."
    models: ["all"]
  - id: ext-glass
    section: ext
    text: "Windscreen, windows and glass roof free of chips and cracks"
    models: ["all"]
  - id: ext-wheels
