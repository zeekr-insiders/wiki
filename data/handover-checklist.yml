  nate-handover: "Nate's Tech & Torque (YouTube), \"Zeekr 7X - Detailed Delivery Handover | Infotainment, App Guide and everything you need to know!\", <https://www.youtube.com/watch?v=KlVyyYCinu4>, accessed 8 November 2026."
