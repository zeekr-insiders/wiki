items:
  - id: pre-app-chargefox
    section: pre-apps
    text: "Install Chargefox and create your account"
    hint: "Sign up in the app. Add a payment card now, not standing at a charger."
    models: ["all"]
    cite: [chargefox]
  - id: pre-app-evie
    section: pre-apps
    text: "Install Evie and create your account"
    hint: "Same again: do it at home on wifi."
    models: ["all"]
    cite: [evie]
  - id: pre-app-nrma
    section: pre-apps
    text: "Install My NRMA and set up your account"
    hint: "Sessions have to start in the My NRMA app to get the member price. Some sites take tap and pay."
    models: ["all"]
    cite: [nrma]
  - id: pre-app-jolt
    section: pre-apps
    text: "Install JOLT if it has sites near you"
    hint: "Registration is in the app; you start a session by QR code or the code on the charger."
    models: ["all"]
    cite: [jolt]
  - id: pre-app-card
    section: pre-apps
    text: "Add a payment card to every app you set up"
    hint: "One card for all of them keeps it simple."
    models: ["all"]
  - id: pre-app-rfid
    section: pre-apps
    text: "Ask each network if it offers an RFID card or tag"
    hint: "Not covered on the sign-up pages we checked, so ask. App-only is fine for most people."
    models: ["all"]
  - id: pre-video
    section: pre-prep
    text: "Watch before you go: Nate's Tech & Torque 7X handover video"
    hint: "A full 7X handover covering the infotainment and the Zeekr app. It shows the MY25/MY26 car."
    models: ["7x"]
    cite: [nate-handover]
    link: {label: "Watch it below", page: "#watch-before-you-go"}
  - id: pre-zeekr-app
    section: pre-prep
    text: "Install the Zeekr app and create your account"
    hint: "Done before the day, you can pair the car in minutes instead of waiting on a sign-up email."
    models: ["all"]
    cite: [nate-handover]
  - id: pre-licence
    section: pre-prep
    text: "Driver's licence in your wallet"
    hint: "Use the licence of the person who is insured."
    models: ["all"]
  - id: pre-insurance
    section: pre-prep
    text: "Comprehensive insurance starts on delivery day"
    hint: "Keep the confirmation on your phone. Give the insurer the VIN as soon as you have it."
    models: ["all"]
  - id: pre-payment
    section: pre-prep
    text: "Final payment or finance confirmed in writing"
    hint: "Bank transfer receipt or finance approval, saved on your phone."
    models: ["all"]
  - id: pre-time
    section: pre-prep
    text: "Booked a daylight slot and allowed an hour or two"
    hint: "A rushed handover is how things get missed. Ask the dealer to book you in properly."
    models: ["all"]
  - id: pre-order-copy
    section: pre-prep
    text: "Your order, spec and any promised extras saved on your phone"
    hint: "You will check the car and the paperwork against this."
    models: ["all"]
  - id: pre-model-year
    section: pre-prep
    text: "Confirmed in writing which model year you are getting"
    hint: "MY25/MY26 and MY27 differ in features and look."
    models: ["7x"]
    cite: [carexpert-7x]
    link: {label: "Which 7X do I have?", page: "models/7x/which-7x.md"}
  - id: pre-model-year-x
    section: pre-prep
    text: "Confirmed in writing whether your X is an MY25 or MY26"
    hint: "The MY26 has a redesigned centre console and touch shortcuts on the steering wheel, and the MY26 AWD has a fridge under the front armrest."
    models: ["x"]
    cite: [carexpert-x-quick, carexpert-x]
  - id: pre-offer-terms
    section: pre-prep
    text: "Launch offer terms in writing"
    hint: "The MY27 launch offer (orders 1 November to 31 December 2026, not demonstrators) lists two years of servicing, a 7 kW wallbox (supply only), free colour choice and 5,000 Zeekr app points."
    models: ["7x-my27"]
    cite: [zeekr-offers, zecar-my27, carexpert-7x]
  - id: pre-home-charger
    section: pre-plan
    text: "Home charger booked or installed if you need one"
    hint: "A licensed electrician does the install. See the quote checklist in Home charging."
    models: ["all"]
    link: {label: "Home charging", page: "guides/charging/home-setup.md"}
  - id: pre-home-wallbox
    section: pre-plan
    text: "MY27 launch wallbox: arrange an electrician"
    hint: "The offer covers the wallbox only. Installation is at your cost."
    models: ["7x-my27"]
    cite: [zecar-my27, carexpert-7x]
  - id: pre-home-portable
    section: pre-plan
    text: "Portable charger: plug it straight into a wall socket"
    hint: "The 7X manual says no adapters, extension cables or multiple ports. Install a proper outlet if the socket is too far."
    models: ["7x"]
    cite: [manual-charging]
  - id: pre-drive-plan
    section: pre-plan
    text: "Plan the drive home and where you will first charge"
    hint: "Pick a charger on or near the route and check you have its app set up."
    models: ["all"]
  - id: paper-invoice
    section: paper
    text: "Invoice matches your order"
    hint: "Check variant, colour, extras, and the drive-away price breakdown."
    models: ["all"]
  - id: paper-vin
    section: paper
    text: "VIN on every document matches the car"
    hint: "Check the invoice, rego papers and insurance against the VIN on the car."
    models: ["all"]
  - id: paper-rego
    section: paper
    text: "Registration papers handed over"
    hint: "Or confirm in writing when and how they arrive."
    models: ["all"]
  - id: paper-booklet
    section: paper
    text: "Service & Warranty Booklet received (or digital copy)"
    hint: "Zeekr's warranty policy refers to it for the service schedule and you show it when claiming."
    models: ["all"]
    cite: [warranty]
  - id: paper-warranty
    section: paper
    text: "Ask what your warranty is, and get any extras in writing"
    hint: "Zeekr's standard terms are 5 years / unlimited km, 8 years / 160,000 km on the high-voltage battery. Launch offers can add to this, so check your contract."
    models: ["all"]
    cite: [warranty, zeekr-7x, carexpert-7x-launch]
  - id: paper-roadside
    section: paper
    text: "Zeekr Roadside 1800 093 357 saved in your phone"
    hint: "24 hours a day, 7 days a week. Have your VIN and location ready when you call."
    models: ["all"]
    cite: [zeekr-service]
  - id: paper-compliance
    section: paper
    text: "Compliance plate and build date photographed"
    hint: "Handy later for working out which model year you have."
    models: ["7x"]
    link: {label: "Which 7X do I have?", page: "models/7x/which-7x.md"}
  - id: paper-manual
    section: paper
    text: "Owner's manual in the car or digital access confirmed"
    hint: "Ask where it lives."
    models: ["all"]
  - id: paper-accessories
    section: paper
    text: "Dealer-fitted accessories listed on the invoice"
    hint: "Accessories fitted before delivery by an authorised dealer carry the full vehicle warranty. Fitted afterwards, 24 months / 20,000 km."
    models: ["all"]
    cite: [warranty]
  - id: ext-paint
    section: ext
    text: "Paint: scratches, chips, swirl marks, repaired-looking patches"
    hint: "Crouch and look along each panel. Check the roof and lower edges."
    models: ["all"]
  - id: ext-gaps
    section: ext
    text: "Panel gaps look even all round"
    hint: "Check bonnet, doors and tailgate."
    models: ["all"]
  - id: ext-colour
    section: ext
    text: "Colour matches your order"
    hint: "Compare against the invoice. Optional colours were free during launch offers."
    models: ["all"]
  - id: ext-glass
    section: ext
    text: "Windscreen, windows and glass roof free of chips and cracks"
    models: ["all"]
  - id: ext-wheels
    section: ext
    text: "Wheels and tyres: kerbing, damage, matching tyres"
    hint: "Photograph all four wheels."
    models: ["all"]
  - id: ext-wheel-size
    section: ext
    text: "Wheels match your order"
    hint: "RWD 19-inch, Performance AWD 21-inch forged on the MY27 car. Long Range sources differ, so go by your order."
    models: ["7x-my27"]
    cite: [carexpert-7x, thebeep-7x]
  - id: ext-wheel-size-my26
    section: ext
    text: "Wheels match your grade"
    hint: "19-inch on the RWD and Long Range RWD, 21-inch forged on the Performance AWD."
    models: ["7x-my26"]
    cite: [brochure-7x]
  - id: ext-wheel-size-x
    section: ext
    text: "Wheels match your grade"
    hint: "19-inch on the RWD, 20-inch forged on the AWD. The MY26 AWD could also be ordered with black 20-inch wheels."
    models: ["x"]
    cite: [carexpert-x-2025, carexpert-x, carexpert-x-quick]
  - id: ext-lights
    section: ext
    text: "Headlights, indicators, brake and reverse lights work"
    hint: "Ask someone to watch while you press the pedal."
    models: ["all"]
  - id: ext-cameras
    section: ext
    text: "Camera and sensor lenses clean and undamaged"
    models: ["all"]
  - id: ext-chargeport
    section: ext
    text: "Charge port flap opens, closes and the socket looks clean"
    models: ["all"]
  - id: ext-ppf
    section: ext
    text: "PPF or tint, if you ordered it: edges clean, no bubbles"
    hint: "Look in daylight."
    models: ["all"]
    link: {label: "Choosing an installer", page: "ownership/accessories/vendors.md"}
  - id: ext-plate-my27
    section: ext
    text: "Rear number plate is on the tailgate"
    hint: "This is how you tell a MY27 7X. The MY25/MY26 car has it on the bumper."
    models: ["7x-my27"]
    cite: [carexpert-7x]
    link: {label: "Which 7X do I have?", page: "models/7x/which-7x.md"}
  - id: ext-plate-my26
    section: ext
    text: "Rear number plate is on the bumper"
    hint: "That is the MY25/MY26 car. The MY27 has it on the tailgate."
    models: ["7x-my26"]
    cite: [carexpert-7x]
    link: {label: "Which 7X do I have?", page: "models/7x/which-7x.md"}
  - id: ext-privacy
    section: ext
    text: "Rear privacy glass fitted"
    hint: "Standard on every MY27 grade."
    models: ["7x-my27"]
    cite: [carexpert-7x, thebeep-7x]
  - id: ext-privacy-my26
    section: ext
    text: "Rear privacy glass fitted, if your grade has it"
    hint: "The Long Range and Performance have it. The base RWD does not."
    models: ["7x-my26"]
    cite: [brochure-7x]
  - id: int-seats
    section: int
    text: "Seats and trim free of marks, tears and loose panels"
    hint: "Check all seats, door cards and the console."
    models: ["all"]
  - id: int-material
    section: int
    text: "Seat material matches your order"
    hint: "On the MY27, Nappa leather moves down to the Long Range. Check the seats against your order."
    models: ["7x-my27"]
    cite: [thebeep-7x]
  - id: int-material-my26
    section: int
    text: "Seat material matches your grade"
    hint: "Soft PU on the RWD and Long Range RWD, Nappa leather on the Performance AWD."
    models: ["7x-my26"]
    cite: [brochure-7x]
  - id: int-seats-x-my25
    section: int
    text: "Seat and comfort features match your order"
    hint: "On the MY25 RWD, the optional Convenience package added heated and ventilated front seats, a heated steering wheel and the 13-speaker Yamaha audio."
    models: ["x-my25"]
    cite: [carexpert-x-2025]
  - id: int-seats-x-my26
    section: int
    text: "Heated front and rear seats work"
    hint: "Standard on both MY26 grades. The AWD adds massaging front seats."
    models: ["x-my26"]
    cite: [chasingcars-x, carexpert-x]
  - id: int-films
    section: int
    text: "Protective film removed from screens and trim"
    models: ["all"]
  - id: int-screens
    section: int
    text: "Screens work, with no dead pixels or marks"
    hint: "Show a white and a black screen to spot dead pixels."
    models: ["all"]
  - id: int-screens-my27
    section: int
    text: "16-inch centre screen and 13-inch driver display present"
    hint: "Standard on every MY27 grade."
    models: ["7x-my27"]
    cite: [carexpert-7x]
  - id: int-hud-my26
    section: int
    text: "Head-up display works, if your grade has it"
    hint: "The Long Range and Performance have the 36-inch head-up display. The base RWD does not."
    models: ["7x-my26"]
    cite: [brochure-7x]
  - id: int-screens-x
    section: int
    text: "14.6-inch touchscreen and 8.8-inch driver display work"
    hint: "The same screens on both grades."
    models: ["x"]
    cite: [carexpert-x]
  - id: int-roof
    section: int
    text: "Sunroof or blind opens and closes smoothly, if fitted"
    models: ["all"]
  - id: int-controls
    section: int
    text: "Steering wheel buttons, window switches, seat adjustment and climate work"
    models: ["all"]
  - id: int-odo
    section: int
    text: "Odometer reading photographed"
    hint: "A new car should show only delivery-run kilometres. If it does not, ask why."
    models: ["all"]
  - id: int-smell
    section: int
    text: "No musty or chemical smell"
    models: ["all"]
  - id: int-dvr
    section: int
    text: "Built-in dashcam (DVR) present and recording"
    hint: "Ask where to find the footage."
    models: ["7x-my27"]
    cite: [carexpert-7x]
  - id: int-dvr-x
    section: int
    text: "Built-in dashcam (DVR) present and recording"
    hint: "Every X has one. Ask where to find the footage."
    models: ["x"]
    cite: [carexpert-x-2025, zeekr-x]
  - id: box-note
    section: box
    text: "Confirm what your order includes, and tick it off here"
    hint: "What comes standard differs by model and year. Use your order as the list, not this page."
    models: ["all"]
  - id: box-keys
    section: box
    text: "Confirm what keys or cards your order includes: count them"
    hint: "Test each one."
    models: ["all"]
  - id: box-keys-7x-my26
    section: box
    text: "Test the UWB key fob and the NFC card"
    hint: "Every MY25/MY26 grade has both. Count them against your order and try each on the car before you leave."
    models: ["7x-my26"]
    cite: [brochure-7x]
  - id: box-keys-x
    section: box
    text: "Test the key fob, the NFC card and the phone key"
    hint: "The X fob is small and square with no keyring loop. The NFC card is tapped on the B-pillar, and the Zeekr app works as a digital key."
    models: ["x"]
    cite: [carexpert-x-review]
  - id: box-cables
    section: box
    text: "Confirm what your order includes: charging cable(s)"
    hint: "The first 1,000 7X buyers were offered a Type 2 cable, a mini portable (10 amp) cable and a 7 kW home charger. Check your contract."
    models: ["7x"]
    cite: [carexpert-7x-launch]
  - id: box-repair
    section: box
    text: "Confirm what your order includes: tyre repair kit or spare"
    hint: "Find where it is stored and check it is sealed and complete."
    models: ["all"]
  - id: box-repair-7x
    section: box
    text: "No spare wheel: find the tyre repair and inflator kit"
    hint: "The MY25/MY26 7X has a kit instead of a spare. Check it is there and sealed."
    models: ["7x-my26"]
    cite: [carsguide-7x]
  - id: box-repair-x
    section: box
    text: "No spare wheel: find the tyre repair kit"
    hint: "The MY25 X has a kit instead of a spare. Check it is there and sealed."
    models: ["x-my25"]
    cite: [carexpert-x-review]
  - id: box-v2l
    section: box
    text: "Ask whether the V2L cable or adapter is in the box"
    hint: "The 7X powers appliances through a separate discharge cable (3.3 kW on the MY25/MY26). The X uses an external adapter, as it has no socket in the cabin."
    models: ["7x", "x"]
    cite: [brochure-7x, carsguide-7x, thedriven-x-2025]
  - id: box-accessories
    section: box
    text: "Accessories you ordered are all there"
    hint: "Floor mats, cargo cover, anything promised."
    models: ["all"]
  - id: box-wallbox
    section: box
    text: "MY27 launch offer: wallbox supplied, plus any gifts"
    hint: "Supply only. The offer listed 5,000 app points, a Frank Green bottle and either an Anker powerbank or sparkling wine."
    models: ["7x-my27"]
    cite: [zecar-my27, carexpert-7x, thebeep-7x]
  - id: box-cards
    section: box
    text: "Any charging network cards supplied"
    hint: "Ask if there are any."
    models: ["all"]
  - id: walk-app
    section: walk
    text: "Pair your phone and the Zeekr app before you leave"
    hint: "Nate's video shows the app features."
    models: ["all"]
    cite: [nate-handover]
  - id: walk-key
    section: walk
    text: "Ask whether your car has a digital key and how to set it up"
    models: ["all"]
  - id: walk-profile
    section: walk
    text: "Driver profile, seat, mirror and steering settings saved"
    models: ["all"]
  - id: walk-charging
    section: walk
