# The Handover checklist (content/buying/handover-checklist.md), rendered by the
# handover_checklist() macro in main.py and made interactive by javascripts/handover.js.
#
# phases:   the three phases, in order.
# sections: id, title, phase. Shown in this order within each phase.
# items:    id (stable: it is the localStorage key for a reader's tick, so never reuse or rename one),
#           section, text (the thing to do), hint (optional, one line),
#           models (all; 7x or x for every year of that model; 7x-my26 (covers MY25/MY26), 7x-my27,
#           x-my25, x-my26 for one year; 009),
#           cite (optional keys into sources), link (optional {label, page}, page relative to content/
#           or an #anchor on the page; or {label, club} naming a link in extra.club, such as forum_url).
# sources:  footnote text in the repo's format: publisher, "title", <url>, accessed date.
#
# Where no source says what comes with the car, an item says "Confirm what your order includes".

phases:
  - {id: pre, title: "Before delivery day"}
  - {id: delivery, title: "Delivery day"}
  - {id: post, title: "After delivery"}

sections:
  - {id: pre-apps, title: "Set up the charging apps (the day before)", phase: pre}
  - {id: pre-prep, title: "Car, app and paperwork", phase: pre}
  - {id: pre-plan, title: "Home charging and the drive home", phase: pre}
  - {id: paper, title: "Paperwork", phase: delivery}
  - {id: ext, title: "Exterior walk-around (in daylight)", phase: delivery}
  - {id: int, title: "Interior", phase: delivery}
  - {id: box, title: "In the box and in the car", phase: delivery}
  - {id: walk, title: "The consultant walks you through", phase: delivery}
  - {id: chg, title: "Charging check", phase: delivery}
  - {id: "off", title: "Before you drive off", phase: delivery}
  - {id: post-days, title: "First days", phase: post}
  - {id: post-week, title: "First week and the club", phase: post}

