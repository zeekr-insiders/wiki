# The wiki's glossary. The Glossary page (content/glossary/index.md) renders this file
# through the glossary() macro in main.py, so this is the only place to edit a term.
#
# Each term:
#   id:         stable anchor (glossary/#id). Never change one that has shipped; links depend on it.
#   term:       the name as it is shown, sentence case.
#   aka:        other names and abbreviations. The page filter and site search match these.
#   category:   one key from `categories` below.
#   definition: one or two plain-English sentences (Markdown). A factual specific (a figure, a
#               date, which Zeekr has what) carries a footnote such as [^carexpert-7x], keyed to
#               `sources` below. Generic definitions need none.
#   see:        wiki pages that explain it: {label, page}, page relative to content/, anchor allowed.
#
# Terms are sorted A to Z by the macro, so add them anywhere. Australian English, no em dashes.

categories:
  battery: Battery
  charging: Charging
  home: Home and grid
  driving: Driving
  money: Ownership and money
  zeekr: Zeekr-specific

