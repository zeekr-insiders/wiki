# Zeekr EV Data Schema v1.1 - Enhanced for Australian Multi-State Support
# ZEV Wiki Project - Comprehensive model specification structure
schema_version: "1.1"

# SCHEMA DOCUMENTATION
# This schema defines the complete structure for Zeekr model data in the ZEV wiki
# Features:
# - Australian multi-state pricing and incentives
# - Comprehensive asset organization
# - State-specific costs and regulations
# - Beautiful comparison table support
# - Maintainable structure for multiple models

# =============================================================================
# ASSETS STRUCTURE
# =============================================================================
# Assets should be organized as follows:
# data/
# ├── schema.yaml (this file)
# └── models/
#     └── {model_slug}/
#         └── {year}.yaml
#
# images/
# ├── models/
# │   └── {model_slug}/              # e.g., "7x", "x", "009"
# │       └── {year}/                # e.g., "2025"
# │           ├── variants/          # Variant-specific images
# │           │   ├── {variant_slug}/  # e.g., "rwd", "long-range-rwd", "performance-awd"
# │           │   │   ├── hero.jpg
# │           │   │   ├── hero_mobile.jpg
# │           │   │   └── gallery/
# │           │   │       ├── exterior/
# │           │   │       ├── interior/
# │           │   │       └── lifestyle/
# │           │   └── ...
# │           ├── colours/           # Colour option images
# │           │   ├── exterior/
# │           │   │   └── {colour_slug}.jpg
# │           │   └── interior/
# │           │       └── {colour_slug}.jpg
# │           ├── technical/         # Technical diagrams
# │           └── downloads/         # Brochures, spec sheets
# │               ├── brochure_{variant_slug}.pdf
# │               └── specifications.pdf
# └── brands/
#     └── zeekr/
#         ├── logo.svg
#         └── brand_assets/
#
# Example paths:
# /images/models/7x/2025/variants/rwd/hero.jpg
# /images/models/7x/2025/variants/long-range-rwd/hero.jpg
# /images/models/7x/2025/variants/performance-awd/hero.jpg

model:
  brand: string               # e.g., "Zeekr"
  name: string               # e.g., "7X"
  slug: string               # URL-friendly version, e.g., "7x" (used in asset paths)
  generation: string|null    # e.g., "1st gen (L1)"
  platform: string|null     # e.g., "SEA 800V"
  body_style: string         # e.g., "SUV", "MPV", "Sedan", "Wagon"
  model_years:               # Years this definition covers
    first: int
    last: int|null
  launch_date: date|null     # Global launch date

  # Model-level assets - use relative paths from /images/
  assets:
    hero_image: string|null           # Main model hero image path
    gallery_path: string|null        # Base path to model gallery
    brochure_url: string|null        # Main model brochure download
    configurator_url: string|null    # Link to online configurator

    # Example paths:
    # hero_image: "models/7x/2025/hero.jpg"
    # gallery_path: "models/7x/2025/gallery/"
    # brochure_url: "models/7x/2025/downloads/brochure.pdf"

  # SEO and metadata
  metadata:
    description: string|null          # Meta description for pages
    keywords: [string,...]           # SEO keywords
    social_image: string|null        # Image for social media sharing

# =============================================================================
# AUSTRALIAN MARKET CONFIGURATION
# =============================================================================
markets:
  - code: string               # "AU" for Australia
    name: string               # "Australia"
    sales_start: date          # When sales began
    sales_status: string       # "on-sale" | "pre-order" | "discontinued" | "coming-soon"

    # Warranty and service
    warranty:
      vehicle: string          # e.g., "5 yr / unlimited km"
      battery: string          # e.g., "8 yr / 160,000 km"
      roadside: string|null    # e.g., "5 yr"
    service:
      interval_km: int|null
      interval_time_months: int|null

    # Multi-state pricing structure for Australia
    pricing:
      currency: string         # "AUD"
      notes: string|null       # General pricing notes
      updated: date           # Last pricing update

      # State-specific pricing breakdown
      states:
        - code: string         # "VIC", "NSW", "QLD", "WA", "SA", "TAS", "ACT", "NT"
          name: string         # "Victoria", "New South Wales", etc.

          # Base pricing per variant
          variants:
            - id: string             # Variant ID reference
              rrp: number|null       # Recommended retail price
              dealer_delivery: number|null    # Dealer delivery fee
              stamp_duty: number|null         # State stamp duty
              registration: number|null       # Registration cost
              ctp_insurance: number|null      # Compulsory third party insurance
              drive_away_estimate: number|null # Total drive-away estimate

          # State-specific incentives and rebates
          incentives:
            ev_rebate:
              amount: number|null      # State EV rebate amount
              eligibility: string|null # Eligibility criteria
              cap_price: number|null   # Price cap for rebate eligibility
              cap_income: number|null  # Income cap for individuals
              status: string          # "active" | "paused" | "expired"
              expiry_date: date|null  # When rebate expires

            stamp_duty_exemption:
              exemption_amount: number|null  # Full or partial exemption
              threshold_price: number|null   # Price threshold for exemption
              status: string                 # "active" | "expired"

            registration_discount:
              discount_amount: number|null   # Annual registration discount
              discount_percentage: number|null # Percentage discount
              duration_years: int|null       # How many years discount applies

            additional_incentives:
              - name: string          # Name of incentive
                amount: number|null   # Dollar amount
                description: string   # What the incentive covers
                status: string       # Current status

          # State regulatory information
          regulations:
            road_user_charge:
              applicable: boolean     # Whether state has EV road user charge
              rate_per_km: number|null # Rate per kilometre if applicable
              start_date: date|null   # When charge starts

            parking_benefits:
              free_public_parking: boolean     # Free parking in some areas
              reduced_rates: boolean           # Reduced parking rates
              ev_only_spaces: boolean          # Dedicated EV parking spaces

    # Available colours for Australian market
    colours:
      exterior:
        - code: string|null      # OEM paint code if known
          name: string           # "Onyx Black"
          slug: string           # URL-friendly: "onyx-black"
          finish: string         # "solid" | "metallic" | "pearl" | "matte"
          price_premium: number|null  # Additional cost for this colour
          availability: [string,...] | "*"   # Variant IDs or "*" for all
          image_path: string|null     # Path to colour image

      interior:
        - name: string           # "Black Vegan Leather"
          slug: string           # "black-vegan-leather"
          material: string       # "vegan leather", "nappa leather", "fabric"
          price_premium: number|null  # Additional cost
          availability: [string,...] | "*"   # Variant IDs or "*" for all
          image_path: string|null     # Path to interior image

# =============================================================================
# VARIANT SPECIFICATIONS (Technical truth per variant)
# =============================================================================
variants:
  - id: string                 # Stable key: "rwd_75", "rwd_lr_100", "awd_perf"
    name: string               # Display name: "RWD", "Long Range RWD", "Performance AWD"
    slug: string               # URL-friendly: "rwd", "long-range-rwd", "performance-awd"

    # Variant assets - use relative paths from /images/
    assets:
      hero_image: string|null         # Hero image for this variant
      hero_image_mobile: string|null  # Mobile-optimized hero image
      gallery_path: string|null       # Path to variant-specific gallery
      360_view_url: string|null       # 360-degree view if available

      # Example paths:
      # hero_image: "models/7x/2025/variants/rwd/hero.jpg"
      # hero_image_mobile: "models/7x/2025/variants/rwd/hero_mobile.jpg"
      # gallery_path: "models/7x/2025/variants/rwd/gallery/"

    # Drivetrain specifications
    drivetrain:
      layout: string           # "RWD" | "AWD" | "FWD"
      motors:                  # 1 or 2 objects
        - axle: string         # "front" | "rear"
          power_kw: number
          torque_nm: number|null

    system_output:
      power_kw: number
      power_hp: number|null    # Converted horsepower for easier reading
      torque_nm: number|null

    # Performance metrics
    performance:
      zero_to_100_s: number|null
      top_speed_kph: number|null
      efficiency_wh_km: number|null     # WLTP/NEDC efficiency
      range:
        standard: string               # "WLTP" | "EPA" | "CLTC"
        km: number|null

    # Battery specifications
    battery:
      gross_kwh: number|null
      usable_kwh: number|null
      chemistry: string|null    # "LFP" | "NCM" | "NCA"
      thermal: string|null      # "heat pump, liquid cooled"
      voltage_v: number|null

    # Charging capabilities
    charging:
      ac:
        max_kw: number|null
        onboard_phases: int|null
        connector: string|null  # "Type 2"
      dc:
        max_kw: number|null
        curve_note: string|null
        time_10_80_min: number|null    # 10-80% charging time
        time_20_80_min: number|null    # 20-80% charging time
        connector: string|null  # "CCS2"
      bidirectional:
        v2l_kw: number|null     # Vehicle to load capacity
        v2h: boolean|null       # Vehicle to home capability
        v2g: boolean|null       # Vehicle to grid capability

    # Chassis and handling
    chassis:
      steering: string|null
      suspension: [string,...]          # e.g., ["MacPherson strut F", "Multi-link R", "Air", "CDC"]
      brakes: string|null
      turning_circle_m: number|null
      wheels_tires:
        standard: string                # Standard wheel/tyre size
        optional: [string,...]          # Optional sizes

    # Dimensions and measurements
    dimensions:
      length_mm: int
      width_mm: int
      height_mm: int
      wheelbase_mm: int
      ground_clearance_mm: int|null

    # Capacities and weights
    capacities:
      kerb_weight_kg: number|null      # Kerb weight
      gross_weight_kg: number|null     # Gross vehicle weight
      tow_braked_kg: number|null       # Braked towing capacity
      tow_unbraked_kg: number|null     # Unbraked towing capacity
      roof_load_kg: number|null        # Roof load capacity
      cargo_rear_l: number|null        # Rear cargo space
      cargo_max_l: number|null         # Max cargo with seats folded
      frunk_l: number|null             # Front trunk capacity
      seats: int                       # Number of seats

    # Infotainment and technology
    infotainment:
      soc: string|null          # System on chip
      os: string|null           # Operating system
      displays:
        cluster_in: number|null          # Instrument cluster size
        centre_in: number|null           # Centre display size
        hud_in: number|null              # Head-up display size
        rear_entertainment: number|null  # Rear entertainment screens
      audio:
        system: string|null              # Audio system brand/name
        speakers: int|null               # Number of speakers
        power_watts: int|null            # Audio system power
      connectivity:
        carplay: boolean         # Apple CarPlay support
        android_auto: boolean    # Android Auto support
        wireless_charging: boolean|null  # Wireless phone charging
        usb_ports: int|null      # Number of USB ports
        wifi_hotspot: boolean|null       # Built-in WiFi hotspot
      features: [string,...]     # Other infotainment features

    # ADAS and safety
    adas_safety:
      level: string|null         # "L0", "L1", "L2", "L2+", "L3"
      features_standard: [string,...]    # Standard safety features
      features_optional: [string,...]    # Optional safety packages
      ratings:
        ancap: string|null               # ANCAP rating
        euro_ncap: string|null           # Euro NCAP rating
        nhtsa: string|null               # NHTSA rating if available

    # Equipment and features
    features:
      standard: [string,...]             # Standard equipment
      optional: [string,...]             # Optional equipment/packages

      # Organized feature categories for comparison tables
      comfort:
        standard: [string,...]
        optional: [string,...]
      convenience:
        standard: [string,...]
        optional: [string,...]
      exterior:
        standard: [string,...]
        optional: [string,...]
      interior:
        standard: [string,...]
        optional: [string,...]

    # Market-specific overrides (for regional differences)
    market_overrides:
      - market: string           # "AU"
        add_features_standard: [string,...]
        remove_features_standard: [string,...]
        add_features_optional: [string,...]
        remove_features_optional: [string,...]
        charging: {}             # Override charging specs if needed
        performance: {}          # Override performance if needed
        capacities: {}           # Override capacities if needed
        infotainment: {}         # Override infotainment if needed
        adas_safety: {}          # Override safety features if needed
        notes: [string,...]      # Market-specific notes

# =============================================================================
# METADATA AND SOURCES
# =============================================================================
sources:                      # Maintainer-facing provenance list
  - title: string             # Source title
    url: string               # Source URL
    accessed: date            # When accessed
    reliability: string       # "official" | "dealer" | "media" | "community"

notes: [string,...]          # General notes about the model/data

# Data maintenance information
data_info:
  last_updated: date         # When this file was last updated
  next_review: date|null     # When to next review this data
  maintainer: string|null    # Who maintains this model data
  status: string             # "current" | "needs_update" | "deprecated"

# =============================================================================
# COMPARISON TABLE STRUCTURE
# =============================================================================
# This schema supports beautiful comparison tables by organizing data into
# logical groups that can be easily rendered:
#
# 1. Overview (model info, pricing)
# 2. Performance (drivetrain, acceleration, top speed)
# 3. Range & Efficiency (battery, range, charging)
# 4. Dimensions (size, weight, capacity)
# 5. Technology (infotainment, connectivity, ADAS)
# 6. Features (comfort, convenience, equipment)
# 7. Ownership (warranty, service, costs)
#
# State-specific data enables dynamic pricing comparisons and
# regional incentive calculations for Australian buyers.