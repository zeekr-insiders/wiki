# Publishes the wiki to GitHub Pages (wiki.zeekrinsiders.com.au) on every push to main.
# Repo setting needed once: Settings > Pages > Source: GitHub Actions.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push supersedes a queued one, but a running deploy finishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the feeds date each page from its git log.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check nav
        run: .venv/bin/python scripts/check_nav.py mkdocs.yml

      - name: Build (strict)
        run: .venv/bin/python -m mkdocs build --strict

      - name: Check citations
        run: .venv/bin/python scripts/check_citations.py site

      - name: Check labels
        run: .venv/bin/python scripts/check_labels.py site mkdocs.yml

      - name: Check search metadata
        run: .venv/bin/python scripts/check_seo.py site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
